# 航空特殊無線技士「法規」問題データ
#
# 出典：電波受験界（情報通信振興会 jyukenkai.com）公開の過去問PDF。
# variants.text は実際に出題された文言をそのまま転記したもののみを追加すること。
# AIによる新規文面の生成・言い換えでの水増しは禁止（過去問のバリエーション以外は載せない）。
#
# explanation 内の条文番号は、確信度が高いものは条数まで、確信が持てないものは
# 法令名までに留め「(条文要確認)」を付けている。使う前に必ず一次資料で裏取りすること。

- id: hoki-0001
  subject: hoki
  topic: 無線局の定義
  variants:
    - source: "2023-10"
      text: |
        「無線局」の定義として、正しいものはどれか。次のうちから選べ。
  choices:
    - 無線設備及び無線設備の操作を行う者の総体をいう。ただし、受信のみを目的とするものを含まない。
    - 無線設備及び無線設備を管理する者の総体をいう。
    - 無線設備及び無線従事者の総体をいう。ただし、発射する電波が著しく微弱で総務省令で定めるものを含まない。
    - 無線設備及び無線設備の操作の監督を行う者の総体をいう。
  answer: 0
  explanation: |
    正答は「無線設備及び無線設備の操作を行う者の総体をいう。ただし、受信のみを
    目的とするものを含まない。」。これは電波法2条5号の定義そのもの。
    選択肢2〜4は「操作を行う者」を「管理する者」「無線従事者」「監督を行う者」に
    すり替えた誤りのパターン。この置き換えパターンは繰り返し出題される。
  law_refs: ["電波法2条5号"]
  figure: null

- id: hoki-0002
  subject: hoki
  topic: 航空用DMEの定義
  variants:
    - source: "2023-10"
      text: |
        次の記述は、「航空用ＤＭＥ」の定義である。電波法施行規則の規定に照らし、
        内に入れるべき字句を下の番号から選べ。
        「航空用ＤＭＥ」とは、９６０ＭＨｚから１,２１５ＭＨｚまでの周波数の電波を
        使用し、航空機において、当該航空機から地表の定点までの＊＊＊を測定する
        ための無線航行業務を行う設備をいう。
  choices:
    - 飛行時間
    - 見通し距離
    - 方位
    - 飛行距離
  answer: 1
  explanation: |
    正答は「見通し距離」。DME（Distance Measuring Equipment）は名前の通り
    「距離」を測定する装置であり、地表の定点までの見通し距離を測る。
  law_refs: ["電波法施行規則3条(条文要確認)"]
  figure: null

- id: hoki-0003
  subject: hoki
  topic: 航空特殊無線技士の操作範囲（空中線電力）
  variants:
    - source: "2023-10"
      text: |
        航空特殊無線技士の資格を有する者が、航空機局（航空運送事業の用に供する
        航空機のものを除く。）の２５,０１０ｋＨｚ以上の周波数の電波を使用する
        無線電話の国内通信のための通信操作を行うことができるのは、空中線電力
        何ワット以下のものか。次のうちから選べ。
  choices:
    - 50ワット
    - 100ワット
    - 5ワット
    - 10ワット
  answer: 0
  explanation: |
    正答は「50ワット」。航空特殊無線技士が扱える航空機局の空中線電力の上限として
    出題される定番の数字。
  law_refs: ["電波法施行令 別表第2(条文要確認)"]
  figure: null

- id: hoki-0004
  subject: hoki
  topic: 電波発射停止命令後の措置
  variants:
    - source: "2023-10"
      text: |
        総務大臣から臨時に電波の発射の停止の命令を受けた無線局は、その発射する
        電波の質を総務省令に適合するように措置したときは、どうしなければならないか。
        次のうちから選べ。
  choices:
    - 直ちにその電波を発射する。
    - その旨を総務大臣に申し出る。
    - 電波の発射について総務大臣の許可を受ける。
    - 他の無線局の通信に混信を与えないことを確かめた後、電波を発射する。
  answer: 1
  explanation: |
    正答は「その旨を総務大臣に申し出る」。措置しただけでは発射を再開できず、
    総務大臣への申出を経て試験的に発射させてもらう、という流れ（電波法72条2項）。
    「直ちに発射」「自分で確認して発射」はいずれも総務大臣の関与を飛ばしている点で誤り。
  law_refs: ["電波法72条2項"]
  figure: null

- id: hoki-0005
  subject: hoki
  topic: 電波法違反に対する処分
  variants:
    - source: "2023-10"
      text: |
        無線局の免許人が電波法又は電波法に基づく命令に違反したときに総務大臣が
        行うことができる処分はどれか。次のうちから選べ。
  choices:
    - 再免許の拒否
    - 通信の相手方又は通信事項の制限
    - 電波の型式の制限
    - 無線局の運用の停止
  answer: 3
  explanation: |
    正答は「無線局の運用の停止」（電波法76条）。3箇月以内の期間を定めて運用停止を
    命じることができる、という条文。他の選択肢は電波法上の別の場面の処分と紛らわしく
    作られている誤答パターン。
  law_refs: ["電波法76条"]
  figure: null

- id: hoki-0006
  subject: hoki
  topic: 免許状の返納
  variants:
    - source: "2023-10"
      text: |
        無線局の免許がその効力を失ったときは、免許人であった者は、その免許状を
        どうしなければならないか。次のうちから選べ。
  choices:
    - 3箇月以内に総務大臣に返納する。
    - 2年間保管する。
    - 1箇月以内に総務大臣に返納する。
    - 直ちに廃棄する。
  answer: 2
  explanation: |
    正答は「1箇月以内に総務大臣に返納する」（電波法24条）。「◯箇月以内に返納」の
    ◯の部分（1箇月）が問われる頻出パターン。
  law_refs: ["電波法24条"]
  figure: null

- id: hoki-0007
  subject: hoki
  topic: 機器の試験・調整時に使用すべき装置
  variants:
    - source: "2023-10"
      text: |
        無線局が、無線設備の機器の試験又は調整を行うために運用するときに、
        なるべく使用しなければならないものはどれか。次のうちから選べ。
  choices:
    - 空中線電力の低下装置
    - 高調波除去装置
    - 擬似空中線回路
    - 水晶発振回路
  answer: 2
  explanation: |
    正答は「擬似空中線回路」。試験・調整中に実際の電波を発射して他局へ混信を
    与えないようにするための仕組み。
  law_refs: ["電波法57条"]
  figure: null

- id: hoki-0008
  subject: hoki
  topic: 呼出事項（自局呼出符号の反復回数）
  variants:
    - source: "2023-10"
      text: |
        次の記述は、航空移動業務の無線電話通信における呼出事項を掲げたものである。
        無線局運用規則の規定に照らし、＊＊＊内に入れるべき字句を下の番号から選べ。
        ① 相手局の呼出符号又は呼出名称　3回以下
        ② 自局の呼出符号又は呼出名称　＊＊＊
  choices:
    - 2回
    - 3回以下
    - 1回
    - 2回以下
  answer: 1
  explanation: |
    正答は「3回以下」。相手局・自局とも呼出符号（呼出名称）は3回以下、という
    対称的なルール。
  law_refs: ["無線局運用規則(条文要確認)"]
  figure: null

- id: hoki-0009
  subject: hoki
  topic: 呼出局の符号が不確実なときの応答
  variants:
    - source: "2023-10"
      text: |
        無線電話通信において、無線局は、自局に対する呼出しを受信した場合に、
        呼出局の呼出符号又は呼出名称が不確実であるときは、応答事項のうち相手局の
        呼出符号又は呼出名称の代わりにどの略語を使用して直ちに応答しなければ
        ならないか。次のうちから選べ。
  choices:
    - 誰かこちらを呼びましたか
    - 反復
    - 各局
    - 貴局名は何ですか
  answer: 0
  explanation: |
    正答は「誰かこちらを呼びましたか」。相手の呼出符号が分からないまま応答する
    ための定型句。
  law_refs: ["無線局運用規則(条文要確認)"]
  figure: null

- id: hoki-0010
  subject: hoki
  topic: 義務航空機局の聴守電波の型式
  variants:
    - source: "2023-10"
      text: |
        義務航空機局の運用義務時間中の聴守電波の型式はどれか。次のうちから選べ。
  choices:
    - A1A
    - A1B
    - A2D
    - A3E又はJ3E
  answer: 3
  explanation: |
    正答は「A3E又はJ3E」。A3E（旧来の振幅変調の音声）とJ3E（SSB音声）が
    義務聴守の対象。
  law_refs: ["電波法施行規則(条文要確認)"]
  figure: null

- id: hoki-0011
  subject: hoki
  topic: 121.5MHzの使用条件
  variants:
    - source: "2023-10"
      text: |
        121.5MHzの周波数の電波を使用することができるのはどの場合か。
        次のうちから選べ。
  choices:
    - 121.5MHz以外の周波数の電波を使用することができない航空機局と航空局との間に通信を行うとき。
    - 気象の照会のために航空局と航空機局との間において通信を行うとき。
    - 時刻の照合のために航空機局相互間において通信を行うとき。
    - 電波の規正に関する通信を行うとき。
  answer: 0
  explanation: |
    正答は選択肢1。121.5MHzは遭難・緊急時に使う周波数で、平常の気象照会・
    時刻照合・電波規正などの通常業務には使わない、という整理。
  law_refs: ["電波法施行規則(条文要確認)"]
  figure: null

- id: hoki-0012
  subject: hoki
  topic: 遭難航空機局が使用する電波（誤っているものを選ぶ）
  variants:
    - source: "2023-10"
      text: |
        遭難航空機局が遭難通信に使用する電波に関する次の記述のうち、
        誤っているものはどれか。次のうちから選べ。
  choices:
    - 遭難航空機局は、責任航空局から指示されている電波がある場合にあっては、当該電波を使用する。
    - 遭難航空機局は、責任航空局から指示されている電波がない場合には、航空機局と航空局との間の通信に使用するためにあらかじめ定められている電波を使用する。
    - 遭難航空機局は、F3E電波156.8MHzを使用することができる。
    - 遭難航空機局は、遭難通信を開始した後は、いかなる場合であっても、使用している電波を変更してはならない。
  answer: 3
  explanation: |
    「誤っているもの」を選ぶ問題。正答（＝誤りの文）は選択肢4。
    実際には、遭難通信中でも、より有効な通信のために必要と認めるときは
    電波を変更できる、という運用上の柔軟性がある。「いかなる場合であっても
    変更してはならない」という言い切りが誤り。
  law_refs: ["電波法施行規則(条文要確認)"]
  figure: null
