  variants:
    - source: "2024-10"
      text: |
        次の記述は、ノータムに関する通信の優先順位について述べたものである。
        無線局運用規則の規定に照らし、＊＊＊内に入れるべき字句を下の番号から選べ。
        ノータムに関する通信は、緊急の度に応じ、＊＊＊に次いでその順位を適宜に
        選ぶことができる。
  choices:
    - 航空機の安全運航に関する通信
    - 無線方向探知に関する通信
    - 遭難通信
    - 緊急通信
  answer: 3
  explanation: |
    正答は「緊急通信」。優先順位は遭難通信＞緊急通信＞安全通信の順で、
    ノータムは「緊急通信に次いで」の位置。最上位の「遭難通信」に次いで、と
    書き換えた選択肢が典型的な誤答。
  law_refs: ["無線局運用規則150条"]
