# 航空特殊無線技士「法規」問題データ
#
# 出典：電波受験界（情報通信振興会 jyukenkai.com）公開の過去問PDF。
# variants.text は実際に出題された文言をそのまま転記したもののみを追加すること。
# AIによる新規文面の生成・言い換えでの水増しは禁止（過去問のバリエーション以外は載せない）。
#
# explanation 内の条文番号は、確信度が高いものは条数まで、確信が持てないものは
# 法令名までに留め「(条文要確認)」を付けている。使う前に必ず一次資料で裏取りすること。

- id: hoki-0001
  subject: hoki
  topic: 無線局の定義
  variants:
    - source: "2023-10"
      text: |
        「無線局」の定義として、正しいものはどれか。次のうちから選べ。
    - source: "2025-06"
      text: |
        「無線局」の定義として、正しいものはどれか。次のうちから選べ。
  choices:
    - 無線設備及び無線設備の操作を行う者の総体をいう。ただし、受信のみを目的とするものを含まない。
    - 無線設備及び無線設備を管理する者の総体をいう。
    - 無線設備及び無線従事者の総体をいう。ただし、発射する電波が著しく微弱で総務省令で定めるものを含まない。
    - 無線設備及び無線設備の操作の監督を行う者の総体をいう。
  answer: 0
  explanation: |
    正答は「無線設備及び無線設備の操作を行う者の総体をいう。ただし、受信のみを
    目的とするものを含まない。」。これは電波法2条5号の定義そのもの。
    選択肢2〜4は「操作を行う者」を「管理する者」「無線従事者」「監督を行う者」に
    すり替えた誤りのパターン。この置き換えパターンは繰り返し出題される。
  law_refs: ["電波法2条5号"]
  figure: null

