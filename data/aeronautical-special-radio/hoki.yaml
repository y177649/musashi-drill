    航空局側・航空機局側のどちらを問われても答えは Ａ３Ｅ又はＪ３Ｅ。
    hoki-0010 は誤答に Ａ１Ａ・Ａ１Ｂ・Ａ２Ｄ が並ぶのに対し、こちらは
    Ｆ３Ｅ・Ｈ３Ｅ・Ｒ３Ｅ が並ぶため別問題として保持している。
