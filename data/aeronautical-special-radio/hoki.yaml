        ＊＊＊内に入れるべき字句を下の番号から選べ。
        「航空用ＤＭＥ」とは、９６０ＭＨｚから１,２１５ＭＨｚまでの周波数の電波を
        使用し、航空機において、当該航空機から地表の定点までの＊＊＊を測定する
