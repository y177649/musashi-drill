        呼出局の呼出符号又は呼出名称が不確実であるときは、応答事項のうち相手局の
        呼出符号又は呼出名称の代わりにどの略語を使用して直ちに応答しなければ
        ならないか。次のうちから選べ。
    - source: "2025-06"
