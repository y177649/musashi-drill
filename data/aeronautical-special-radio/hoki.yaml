        無線電話通信において、無線局は、自局に対する呼出しを受信した場合に、
        呼出局の呼出符号又は呼出名称が不確実であるときは、応答事項のうち相手局の
        呼出符号又は呼出名称の代わりにどの略語を使用して直ちに応答しなければ
        ならないか。次のうちから選べ。
  choices:
    - 誰かこちらを呼びましたか
    - 反復
    - 各局
    - 貴局名は何ですか
  answer: 0
  explanation: |
    正答は「誰かこちらを呼びましたか」。相手の呼出符号が分からないまま応答する
    ための定型句。
  law_refs: ["無線局運用規則(条文要確認)"]
  figure: null

- id: hoki-0010
  subject: hoki
  topic: 義務航空機局の聴守電波の型式
  variants:
    - source: "2023-10"
      text: |
        義務航空機局の運用義務時間中の聴守電波の型式はどれか。次のうちから選べ。
    - source: "2024-06"
      text: |
        義務航空機局の運用義務時間中の聴守電波の型式はどれか。次のうちから選べ。
    - source: "2024-10"
      text: |
        義務航空機局の運用義務時間中の聴守電波の型式はどれか。次のうちから選べ。
  choices:
    - A1A
    - A1B
    - A2D
    - A3E又はJ3E
  answer: 3
  explanation: |
    正答は「A3E又はJ3E」。A3E（旧来の振幅変調の音声）とJ3E（SSB音声）が
    義務聴守の対象。
  law_refs: ["電波法施行規則(条文要確認)"]
  figure: null

- id: hoki-0011
  subject: hoki
  topic: 121.5MHzの使用条件
  variants:
    - source: "2023-10"
      text: |
        121.5MHzの周波数の電波を使用することができるのはどの場合か。
        次のうちから選べ。
    - source: "2026-06"
      text: |
        121.5MHzの周波数の電波を使用することができるのはどの場合か。
        次のうちから選べ。
  choices:
    - 121.5MHz以外の周波数の電波を使用することができない航空機局と航空局との間に通信を行うとき。
    - 気象の照会のために航空局と航空機局との間において通信を行うとき。
    - 時刻の照合のために航空機局相互間において通信を行うとき。
    - 電波の規正に関する通信を行うとき。
  answer: 0
  explanation: |
    正答は選択肢1。121.5MHzは遭難・緊急時に使う周波数で、平常の気象照会・
    時刻照合・電波規正などの通常業務には使わない、という整理。
  law_refs: ["電波法施行規則(条文要確認)"]
  figure: null

- id: hoki-0012
  subject: hoki
  topic: 遭難航空機局が使用する電波（誤っているものを選ぶ）
  variants:
    - source: "2023-10"
      text: |
        遭難航空機局が遭難通信に使用する電波に関する次の記述のうち、
        誤っているものはどれか。次のうちから選べ。
  choices:
    - 遭難航空機局は、責任航空局から指示されている電波がある場合にあっては、当該電波を使用する。
    - 遭難航空機局は、責任航空局から指示されている電波がない場合には、航空機局と航空局との間の通信に使用するためにあらかじめ定められている電波を使用する。
    - 遭難航空機局は、F3E電波156.8MHzを使用することができる。
    - 遭難航空機局は、遭難通信を開始した後は、いかなる場合であっても、使用している電波を変更してはならない。
  answer: 3
  explanation: |
    「誤っているもの」を選ぶ問題。正答（＝誤りの文）は選択肢4。
    実際には、遭難通信中でも、より有効な通信のために必要と認めるときは
    電波を変更できる、という運用上の柔軟性がある。「いかなる場合であっても
    変更してはならない」という言い切りが誤り。
  law_refs: ["電波法施行規則(条文要確認)"]
  figure: null

- id: hoki-0013
  subject: hoki
  topic: 無線局の定義（穴埋め）
  variants:
    - source: "2024-06"
      text: |
        次の記述は、電波法に規定する「無線局」の定義である。＊＊＊内に入れるべき
        字句を下の番号から選べ。
        「無線局」とは、無線設備及び＊＊＊の総体をいう。ただし、受信のみを目的と
        するものを含まない。
    - source: "2025-02"
      text: |
        次の記述は、電波法に規定する「無線局」の定義である。＊＊＊内に入れるべき
        字句を下の番号から選べ。
        「無線局」とは、無線設備及び＊＊＊の総体をいう。ただし、受信のみを目的と
        するものを含まない。
  choices:
    - 無線通信を行う者
    - 無線設備を所有する者
    - 無線設備の操作を行う者
    - 無線局の管理を行う者
  answer: 2
  explanation: |
    正答は「無線設備の操作を行う者」。hoki-0001 と同じ電波法2条5号の定義だが、
    こちらは穴埋め形式。「所有する者」「管理を行う者」ではなく「操作を行う者」、
    という一点が繰り返し問われる。
  law_refs: ["電波法2条5号"]
  figure: null

- id: hoki-0014
  subject: hoki
  topic: 予備免許で指定される事項
  variants:
    - source: "2024-02"
      text: |
        無線局の予備免許が与えられるときに総務大臣から指定される事項はどれか。
        次のうちから選べ。
  choices:
    - 空中線電力
    - 無線局の種別
    - 免許の有効期間
    - 無線設備の設置場所
  answer: 0
  explanation: |
    正答は「空中線電力」。予備免許で指定されるのは工事落成の期限・電波の型式及び
    周波数・呼出符号（識別信号）・空中線電力・運用許容時間。
    「無線局の種別」「免許の有効期間」「無線設備の設置場所」は指定事項ではない。
  law_refs: ["電波法8条1項"]
  figure: null

- id: hoki-0015
  subject: hoki
  topic: 免許状の記載事項（該当しないものを選ぶ）
  variants:
    - source: "2024-10"
      text: |
        無線局の免許状に記載される事項に該当しないものはどれか。次のうちから選べ。
  choices:
    - 空中線の型式及び構成
    - 通信の相手方及び通信事項
    - 無線局の目的
    - 無線設備の設置場所
  answer: 0
  explanation: |
    正答（該当しないもの）は「空中線の型式及び構成」。これは無線局事項書・工事設計書
    の側に書く事項で、免許状には載らない。免許状には免許の年月日及び有効期間、
    無線局の目的、通信の相手方及び通信事項、無線設備の設置場所、電波の型式及び
    周波数、空中線電力、運用許容時間などが記載される。
  law_refs: ["電波法14条2項"]
  figure: null

- id: hoki-0016
  subject: hoki
  topic: 変更工事の許可後に運用できる時期
  variants:
    - source: "2025-10"
      text: |
        無線局の無線設備の変更の工事の許可を受けた免許人は、総務省令で定める場合を
        除き、どのような手続をとった後でなければ、許可に係る無線設備を運用しては
        ならないか。次のうちから選べ。
    - source: "2026-02"
      text: |
        無線局の無線設備の変更の工事の許可を受けた免許人は、総務省令で定める場合を
        除き、どのような手続をとった後でなければ、許可に係る無線設備を運用しては
        ならないか。次のうちから選べ。
  choices:
    - 総務大臣の検査を受け、当該工事の結果が許可の内容に適合していると認められた後
    - 当該工事の結果が許可の内容に適合している旨を総務大臣に届け出た後
    - 工事が完了した後、その運用について総務大臣の許可を受けた後
    - 総務大臣に運用開始の予定期日を届け出た後
  answer: 0
  explanation: |
    正答は「総務大臣の検査を受け、当該工事の結果が許可の内容に適合していると
    認められた後」。届出や自己申告では足りず、検査に合格することが運用の条件。
    「届け出た後」「許可を受けた後」との差し替えが誤答パターン。
  law_refs: ["電波法18条1項"]
  figure: null

- id: hoki-0017
  subject: hoki
  topic: 電波法の目的
  variants:
    - source: "2026-06"
      text: |
        次の記述は、電波法の目的である。＊＊＊内に入れるべき字句を下の番号から選べ。
        この法律は、電波の公平かつ＊＊＊な利用を確保することによって、公共の福祉を
        増進することを目的とする。
  choices:
    - 積極的
    - 能率的
    - 経済的
    - 能動的
  answer: 1
  explanation: |
    正答は「能率的」。電波法1条の「電波の公平且つ能率的な利用を確保する」。
    「経済的」「積極的」「能動的」といった紛らわしい語への差し替えが誤答パターン。
  law_refs: ["電波法1条"]
  figure: null

- id: hoki-0018
  subject: hoki
  topic: 航空機局等の受信設備の設置箇所
  variants:
    - source: "2024-02"
      text: |
        次の記述は、航空機局等の条件について述べたものである。電波法施行規則の規定に
        照らし、＊＊＊内に入れるべき字句を下の番号から選べ。
        航空機局及び航空機地球局（航空機の安全運航又は正常運航に関する通信を行わない
        ものを除く。）の受信設備は、なるべく、航空機の＊＊＊によって妨害を受けない
        ような箇所に設置されていなければならない。
    - source: "2025-06"
      text: |
        次の記述は、航空機局等の条件について述べたものである。電波法施行規則の規定に
        照らし、＊＊＊内に入れるべき字句を下の番号から選べ。
        航空機局及び航空機地球局（航空機の安全運航又は正常運航に関する通信を行わない
        ものを除く。）の受信設備は、なるべく、航空機の＊＊＊によって妨害を受けない
        ような箇所に設置されていなければならない。
    - source: "2025-10"
      text: |
        次の記述は、航空機局等の条件について述べたものである。電波法施行規則の規定に
        照らし、＊＊＊内に入れるべき字句を下の番号から選べ。
        航空機局及び航空機地球局（航空機の安全運航又は正常運航に関する通信を行わない
        ものを除く。）の受信設備は、なるべく、航空機の＊＊＊によって妨害を受けない
        ような箇所に設置されていなければならない。
  choices:
    - 機械的雑音
    - 衝撃
    - 電気的雑音
    - 振動
  answer: 2
  explanation: |
    正答は「電気的雑音」。受信設備が妨害を受ける相手は電気的な雑音であり、
    「衝撃」「振動」「機械的雑音」は機械的な話なので受信への妨害の文脈では誤り。
    3期連続で出題されている頻出問題。
  law_refs: ["電波法施行規則(条文要確認)"]
  figure: null

- id: hoki-0019
  subject: hoki
  topic: 航空機用救命無線機の一般的条件（規定されていないものを選ぶ）
  variants:
    - source: "2024-06"
      text: |
        航空機用救命無線機の一般的条件として無線設備規則に規定されていないものは
        どれか。次のうちから選べ。
  choices:
    - 筐体に黄色又は橙色の彩色が施されていること。
    - 電源は、人体に危害を及ぼさないように適切にしゃへいしてあること。
    - 航空機に固定され、容易に取り外せないものを除き、小型かつ軽量であって、一人で容易に持ち運びができること。
    - 海面に浮き、横転した場合に復元すること、救命浮機等に係留することができること（救助のため海面で使用するものに限る。）。
  answer: 1
  explanation: |
    正答（規定されていないもの）は「電源は、人体に危害を及ぼさないように適切に
    しゃへいしてあること」。他の3つ（目立つ彩色・小型軽量で持ち運び可能・海面で
    浮き復元し係留できる）は、いずれも遭難者が海上で使うことを想定した条件で、
    実際に無線設備規則に並んでいる。
  law_refs: ["無線設備規則45条の3の2(条文要確認)"]
  figure: null

- id: hoki-0020
  subject: hoki
  topic: 電波の型式の表示記号（A3E）
  variants:
    - source: "2025-02"
      text: |
        電波の主搬送波の変調の型式が振幅変調で両側波帯のもの、主搬送波を変調する
        信号の性質がアナログ信号である単一チャネルのものであって、伝送情報の型式が
        電話（音響の放送を含む。）の電波の型式を表示する記号はどれか。
        次のうちから選べ。
    - source: "2026-06"
      text: |
        電波の主搬送波の変調の型式が振幅変調で両側波帯のもの、主搬送波を変調する
        信号の性質がアナログ信号である単一チャネルのものであって、伝送情報の型式が
        電話（音響の放送を含む。）の電波の型式を表示する記号はどれか。
        次のうちから選べ。
  choices:
    - J3E
    - A3E
    - F1B
    - F3E
  answer: 1
  explanation: |
    正答は「A3E」。1文字目=主搬送波の変調（A:振幅変調 両側波帯／J:単側波帯抑圧搬送波／
    F:周波数変調）、2文字目=変調信号の性質（3:アナログ単一チャネル／1:デジタル単一
    チャネル変調副搬送波なし）、3文字目=伝送情報（E:電話／B:電信）。
    「振幅変調・両側波帯・アナログ単一チャネル・電話」なので A3E。
  law_refs: ["電波法施行規則4条の2"]
  figure: null

- id: hoki-0021
  subject: hoki
  topic: 失った免許証を発見したときの返納期限
  variants:
    - source: "2024-02"
      text: |
        無線従事者は、免許証を失ったためにその再交付を受けた後、失った免許証を
        発見したときは、発見した日から何日以内にその免許証を総務大臣に返納しなければ
        ならないか。次のうちから選べ。
    - source: "2024-10"
      text: |
        無線従事者は、免許証を失ったためにその再交付を受けた後、失った免許証を
        発見したときは、発見した日から何日以内にその免許証を総務大臣に返納しなければ
        ならないか。次のうちから選べ。
    - source: "2026-06"
      text: |
        無線従事者は、免許証を失ったためにその再交付を受けた後、失った免許証を
        発見したときは、発見した日から何日以内にその免許証を総務大臣に返納しなければ
        ならないか。次のうちから選べ。
  choices:
    - 7日
    - 10日
    - 14日
    - 30日
  answer: 1
  explanation: |
    正答は「10日」。免許証の返納は「10日以内」。無線従事者が死亡・失そうの宣告を
    受けた場合の戸籍法による届出義務者の返納も同じく10日以内。
    数字だけを差し替える出題なので「10」を確実に覚える。
  law_refs: ["電波法施行規則51条"]
  figure: null

- id: hoki-0022
  subject: hoki
  topic: 航空特殊無線技士の操作範囲（航空局・周波数）
  variants:
    - source: "2024-06"
      text: |
        航空特殊無線技士の資格を有する者が、航空局（航空交通管制の用に供するものを
        除く。）の空中線電力５０ワット以下の無線電話の国内通信のための通信操作を
        行うことができる周波数の電波はどれか。次のうちから選べ。
  choices:
    - 1,606.5kHz以上
    - 25,010kHz以上
    - 25,010kHz未満
    - 28,000kHz以下
  answer: 1
  explanation: |
    正答は「25,010kHz以上」。hoki-0003（航空機局側・空中線電力を問う）と対になる
    出題で、こちらは航空局側・周波数を問う。「50ワット以下」と「25,010kHz以上」が
    セットの数字。「未満」への差し替えが誤答パターン。
  law_refs: ["電波法施行令3条(条文要確認)"]
  figure: null

- id: hoki-0023
  subject: hoki
  topic: 業務に従事中の免許証の取扱い
  variants:
    - source: "2025-02"
      text: |
        無線従事者は、その業務に従事しているときは、免許証をどのようにしていなければ
        ならないか。次のうちから選べ。
  choices:
    - 無線局に備え付ける。
    - 携帯する。
    - 通信室内の見やすい箇所に掲げる。
    - 通信室内に保管する。
  answer: 1
  explanation: |
    正答は「携帯する」。備付け・掲示・保管ではなく、本人が身につけて持っていること。
  law_refs: ["電波法施行規則38条"]
  figure: null

- id: hoki-0024
  subject: hoki
  topic: 無線従事者の免許を与えないことができる者
  variants:
    - source: "2025-06"
      text: |
        総務大臣が無線従事者の免許を与えないことができる者はどれか。
        次のうちから選べ。
    - source: "2026-02"
      text: |
        総務大臣が無線従事者の免許を与えないことができる者はどれか。
        次のうちから選べ。
  choices:
    - 無線従事者の免許を取り消され、取消しの日から2年を経過しない者
    - 日本の国籍を有しない者
    - 無線従事者の免許を取り消され、取消しの日から5年を経過しない者
    - 刑法に規定する罪を犯し罰金以上の刑に処せられ、その執行を終わり、又はその執行を受けることがなくなった日から2年を経過しない者
  answer: 0
  explanation: |
    正答は「取消しの日から2年を経過しない者」。年数を5年に差し替えた選択肢が
    必ず並ぶので「2年」を確実に。「日本の国籍を有しない者」は欠格事由ではない。
  law_refs: ["電波法42条"]
  figure: null

- id: hoki-0025
  subject: hoki
  topic: 検査結果の指示に対する措置後の手続
  variants:
    - source: "2024-02"
      text: |
        無線局の免許人は、無線局の検査の結果について総務大臣から指示を受け相当な
        措置をしたときは、どうしなければならないか。次のうちから選べ。
    - source: "2024-10"
      text: |
        無線局の免許人は、無線局の検査の結果について総務大臣から指示を受け相当な
        措置をしたときは、どうしなければならないか。次のうちから選べ。
  choices:
    - その措置の内容を無線局事項書の写しの余白に記載する。
    - その措置の内容を検査職員に連絡し、再度検査を受ける。
    - 速やかにその措置の内容を総務大臣に報告する。
    - その措置の内容を免許状の余白に記載する。
  answer: 2
  explanation: |
    正答は「速やかにその措置の内容を総務大臣に報告する」。措置して終わりではなく
    報告まで必要。「余白に記載」「再度検査」はいずれも報告義務を回避させる誤答。
  law_refs: ["電波法73条(条文要確認)"]
  figure: null

- id: hoki-0026
  subject: hoki
  topic: 検査結果の指示に対する措置後の手続（免許記録版）
  variants:
    - source: "2026-06"
      text: |
        無線局の免許人は、無線局の検査の結果について総務大臣から指示を受け相当な
        措置をしたときは、どうしなければならないか。次のうちから選べ。
  choices:
    - その措置の内容を免許記録の写し又は免許事項証明書に記載する。
    - 速やかにその措置の内容を総務大臣に報告する。
    - その措置の内容を無線局事項書の写しの余白に記載する。
    - その措置の内容を検査職員に連絡し、再度検査を受ける。
  answer: 1
  explanation: |
    正答は hoki-0025 と同じ「速やかにその措置の内容を総務大臣に報告する」。
    2026-06 期では誤答選択肢が「免許状の余白」から「免許記録の写し又は免許事項
    証明書」に差し替わっている（免許状制度の見直しを反映した新しい言い回し）。
    選択肢の集合が違うため hoki-0025 とは別問題として保持している。
  law_refs: ["電波法73条(条文要確認)"]
  figure: null

- id: hoki-0027
  subject: hoki
  topic: 臨時検査が行われる場合
  variants:
    - source: "2025-02"
      text: |
        無線局の臨時検査（電波法第７３条第５項の検査）が行われることがあるのは
        どの場合か。次のうちから選べ。
    - source: "2025-10"
      text: |
        無線局の臨時検査（電波法第７３条第５項の検査）が行われることがあるのは
        どの場合か。次のうちから選べ。
    - source: "2026-02"
      text: |
        無線局の臨時検査（電波法第７３条第５項の検査）が行われることがあるのは
        どの場合か。次のうちから選べ。
  choices:
    - 無線設備の変更の工事を行ったとき。
    - 無線従事者を選任したとき。
    - 無線局の再免許の申請をし、総務大臣から免許が与えられたとき。
    - 総務大臣から臨時に電波の発射の停止を命じられたとき。
  answer: 3
  explanation: |
    正答は「総務大臣から臨時に電波の発射の停止を命じられたとき」。
    臨時検査は「何か問題が起きたとき」に行うもの。変更工事や再免許、選任届は
    平常の手続なので臨時検査の契機にならない。3期連続の頻出問題。
  law_refs: ["電波法73条5項"]
  figure: null

- id: hoki-0028
  subject: hoki
  topic: 臨時に電波の発射の停止を命ずることができる場合
  variants:
    - source: "2025-06"
      text: |
        総務大臣が無線局に対して臨時に電波の発射の停止を命ずることができるのは
        どの場合か。次のうちから選べ。
  choices:
    - 無線局が免許状に記載された空中線電力の範囲を超えて運用していると認めるとき。
    - 無線局が略語を使用して通信を行っていると認めるとき。
    - 無線局の発射する電波が他の無線局の通信に混信を与えていると認めるとき。
    - 無線局の発射する電波の質が総務省令で定めるものに適合していないと認めるとき。
  answer: 3
  explanation: |
    正答は「電波の質が総務省令で定めるものに適合していないと認めるとき」。
    臨時の発射停止の要件は「電波の質」であって、混信や空中線電力超過ではない
    （それらは別条の運用停止・制限の話）。hoki-0004 はこの命令を受けた後の
    措置を問う続きの問題。
  law_refs: ["電波法72条1項"]
  figure: null

- id: hoki-0029
  subject: hoki
  topic: 電波法違反に対する処分（期間を定めて行う制限）
  variants:
    - source: "2026-02"
      text: |
        無線局の免許人が電波法又は電波法に基づく命令に違反したときに総務大臣が
        行うことができる処分はどれか。次のうちから選べ。
  choices:
    - 期間を定めて行う周波数の制限
    - 期間を定めて行う通信の相手方又は通信事項の制限
    - 送信空中線の撤去の命令
    - 期間を定めて行う電波の型式の制限
  answer: 0
  explanation: |
    正答は「期間を定めて行う周波数の制限」。電波法76条1項で総務大臣ができるのは
    3箇月以内の運用停止、または期間を定めての運用許容時間・周波数・空中線電力の
    制限。「通信の相手方又は通信事項」「電波の型式」は制限の対象に含まれない。
    hoki-0005 と設問文は同一だが選択肢の組が異なるため別問題として保持している。
  law_refs: ["電波法76条1項"]
  figure: null

- id: hoki-0030
  subject: hoki
  topic: 無線従事者の免許の取消し
  variants:
    - source: "2024-02"
      text: |
        総務大臣から無線従事者がその免許を取り消されることがあるのはどの場合か。
        次のうちから選べ。
    - source: "2024-06"
      text: |
        総務大臣から無線従事者がその免許を取り消されることがあるのはどの場合か。
        次のうちから選べ。
    - source: "2025-10"
      text: |
        総務大臣から無線従事者がその免許を取り消されることがあるのはどの場合か。
        次のうちから選べ。
  choices:
    - 引き続き5年以上無線設備の操作を行わなかったとき。
    - 電波法又は電波法に基づく命令に違反したとき。
    - 日本の国籍を有しない者となったとき。
    - 免許証を失ったとき。
  answer: 1
  explanation: |
    正答は「電波法又は電波法に基づく命令に違反したとき」。
    操作をしなかった期間・国籍・免許証の紛失は、いずれも取消事由ではない
    （免許証を失ったら再交付を受ければよい）。3期で出題され、選択肢の並びまで
    同じだった頻出問題。
  law_refs: ["電波法79条1項"]
  figure: null

- id: hoki-0031
  subject: hoki
  topic: 違反して運用した無線局を認めたとき
  variants:
    - source: "2024-10"
      text: |
        無線局の免許人は、電波法又は電波法に基づく命令の規定に違反して運用した
        無線局を認めたときは、どうしなければならないか。次のうちから選べ。
  choices:
    - その無線局の免許人にその旨を通知する。
    - その無線局の免許人を告発する。
    - 総務省令で定める手続により、総務大臣に報告する。
    - その無線局の電波の発射を停止させる。
  answer: 2
  explanation: |
    正答は「総務省令で定める手続により、総務大臣に報告する」。
    自分で相手に通知したり、告発したり、発射を止めさせたりするのではなく、
    総務大臣への報告義務である点が要点。
  law_refs: ["電波法80条"]
  figure: null

- id: hoki-0032
  subject: hoki
  topic: 無線局の免許の取消し
  variants:
    - source: "2025-02"
      text: |
        総務大臣から無線局の免許が取り消されることがあるのはどの場合か。
        次のうちから選べ。
    - source: "2025-06"
      text: |
        総務大臣から無線局の免許が取り消されることがあるのはどの場合か。
        次のうちから選べ。
  choices:
    - 不正な手段により無線局の免許を受けたとき。
    - 免許状を失ったとき。
    - 免許状に記載されていない周波数の電波を使用したとき。
    - 運用許容時間外の運用をしたとき。
  answer: 0
  explanation: |
    正答は「不正な手段により無線局の免許を受けたとき」。
    免許そのものの前提が崩れる事由なので取消し。免許状の紛失は再交付で済み、
    周波数逸脱や運用許容時間外運用は運用停止・制限の対象であって即取消しではない。
  law_refs: ["電波法76条4項"]
  figure: null

- id: hoki-0033
  subject: hoki
  topic: 遅滞なく免許状を返さなければならない場合
  variants:
    - source: "2024-02"
      text: |
        無線局の免許人が総務大臣に遅滞なく免許状を返さなければならないのはどの
        場合か。次のうちから選べ。
    - source: "2024-10"
      text: |
        無線局の免許人が総務大臣に遅滞なく免許状を返さなければならないのはどの
        場合か。次のうちから選べ。
  choices:
    - 免許状を汚したために再交付の申請を行い、新たな免許状の交付を受けたとき。
    - 無線局の運用の停止を命じられたとき。
    - 電波の発射の停止を命じられたとき。
    - 免許人が電波法に違反したとき。
  answer: 0
  explanation: |
    正答は「免許状を汚したために再交付の申請を行い、新たな免許状の交付を受けたとき」。
    古い免許状が手元に残るので返す、という理屈。運用停止や発射停止を命じられても
    免許自体は生きているので返納は不要。免許が効力を失ったときの「1箇月以内に返納」
    （hoki-0006）とは別の規定。
  law_refs: ["電波法施行規則38条(条文要確認)"]
  figure: null

- id: hoki-0034
  subject: hoki
  topic: 無線従事者を選任・解任したときの手続
  variants:
    - source: "2025-02"
      text: |
        無線局の免許人は、無線従事者を選任し、又は解任したときは、どうしなければ
        ならないか。次のうちから選べ。
    - source: "2025-10"
      text: |
        無線局の免許人は、無線従事者を選任し、又は解任したときは、どうしなければ
        ならないか。次のうちから選べ。
    - source: "2026-02"
      text: |
        無線局の免許人は、無線従事者を選任し、又は解任したときは、どうしなければ
        ならないか。次のうちから選べ。
  choices:
    - 2週間以内にその旨を総務大臣に届け出る。
    - 遅滞なく、その旨を総務大臣に届け出る。
    - 1箇月以内にその旨を総務大臣に報告する。
    - 速やかに総務大臣の承認を受ける。
  answer: 1
  explanation: |
    正答は「遅滞なく、その旨を総務大臣に届け出る」。
    日数を切った期限でも、報告でも、承認でもなく「遅滞なく・届出」。
    事前の承認は不要（選任してから届け出る）。3期連続の頻出問題。
  law_refs: ["電波法51条"]
  figure: null

- id: hoki-0035
  subject: hoki
  topic: 免許状の記載事項に変更を生じたとき
  variants:
    - source: "2025-06"
      text: |
        無線局の免許人は、免許状に記載した事項に変更を生じたときは、どうしなければ
        ならないか。次のうちから選べ。
  choices:
    - 遅滞なく、その旨を総務大臣に報告する。
    - 総務大臣に再免許を申請する。
    - 免許状を総務大臣に提出し、訂正を受ける。
    - 直ちに、その旨を総務大臣に届け出る。
  answer: 2
  explanation: |
    正答は「免許状を総務大臣に提出し、訂正を受ける」。
    報告や届出だけでは足りず、現物を出して訂正してもらう。再免許の申請でもない。
  law_refs: ["電波法21条"]
  figure: null

- id: hoki-0036
  subject: hoki
  topic: 遅滞なく総務大臣に届け出なければならない場合
  variants:
    - source: "2026-06"
      text: |
        無線局の免許人が遅滞なく、総務大臣に届け出なければならないのはどの場合か。
        次のうちから選べ。
  choices:
    - 通信の相手方に変更を生じたとき。
    - 通信事項に変更を生じたとき。
    - 免許人の住所に変更を生じたとき。
    - 無線局の目的に変更を生じたとき。
  answer: 2
  explanation: |
    正答は「免許人の住所に変更を生じたとき」。住所変更は事後の届出で足りる。
    通信の相手方・通信事項・無線局の目的の変更は、いずれも事前に総務大臣の
    許可を受けなければならない事項なので「届け出れば済む」ものではない。
  law_refs: ["電波法20条", "電波法17条1項"]
  figure: null

- id: hoki-0037
  subject: hoki
  topic: 無線通信の原則（該当するものを選ぶ・簡潔）
  variants:
    - source: "2024-02"
      text: |
        一般通信方法における無線通信の原則として無線局運用規則に定める事項に
        該当するものはどれか。次のうちから選べ。
  choices:
    - 無線通信を行う場合においては、略符号以外の用語を使用してはならない。
    - 無線通信は、長時間継続して行ってはならない。
    - 無線通信は、正確に行うものとし、通信上の誤りを知ったときは、通報の送信終了後、訂正箇所を通知しなければならない。
    - 無線通信に使用する用語は、できる限り簡潔でなければならない。
  answer: 3
  explanation: |
    正答は「無線通信に使用する用語は、できる限り簡潔でなければならない」。
    原則は①必要のない無線通信は行わない ②用語はできる限り簡潔に
    ③正確に行い、誤りを知ったときは「直ちに」訂正する、の3つ。
    「送信終了後に訂正」は「直ちに訂正」の書き換えなので誤り。
    「長時間継続して行ってはならない」「略符号以外を使用してはならない」は
    そもそも原則に含まれない。
  law_refs: ["無線局運用規則10条"]
  figure: null

- id: hoki-0038
  subject: hoki
  topic: 無線通信の原則（該当するものを選ぶ・必要のない通信）
  variants:
    - source: "2024-06"
      text: |
        一般通信方法における無線通信の原則として無線局運用規則に定める事項に
        該当するものはどれか。次のうちから選べ。
  choices:
    - 必要のない無線通信は、これを行ってはならない。
    - 無線通信は、試験電波を発射した後でなければ行ってはならない。
    - 無線通信は、正確に行うものとし、通信上の誤りを知ったときは、通報の送信終了後、訂正箇所を通知しなければならない。
    - 無線通信は、長時間継続して行ってはならない。
  answer: 0
  explanation: |
    正答は「必要のない無線通信は、これを行ってはならない」。
    hoki-0037 と設問文は同一だが選択肢の組が違うため別問題として保持している。
    引っかけの作り方は共通で、「訂正は直ちに」を「送信終了後」に、
    原則にない「長時間継続」「試験電波」を混ぜてくる。
  law_refs: ["無線局運用規則10条"]
  figure: null

- id: hoki-0039
  subject: hoki
  topic: 電波の型式及び周波数はどの書類によるか
  variants:
    - source: "2024-10"
      text: |
        無線局を運用する場合においては、遭難通信を行う場合を除き、電波の型式及び
        周波数は、どの書類に記載されたところによらなければならないか。
        次のうちから選べ。
  choices:
    - 無線局の免許の申請書の写し
    - 無線局事項書の写し
    - 免許状
    - 免許証
  answer: 2
  explanation: |
    正答は「免許状」。運用の根拠になるのは常に免許状（局に対するもの）で、
    免許証（人に対するもの）ではない。申請書や事項書の写しでもない。
  law_refs: ["電波法53条", "電波法54条"]
  figure: null

- id: hoki-0040
  subject: hoki
  topic: 識別信号はどの書類によるか
  variants:
    - source: "2025-06"
      text: |
        無線局を運用する場合においては、遭難通信を行う場合を除き、識別信号
        （呼出符号、呼出名称等をいう。）は、どの書類に記載されたところによらなければ
        ならないか。次のうちから選べ。
  choices:
    - 免許状
    - 免許証
    - 無線局事項書の写し
    - 無線局の免許の申請書の写し
  answer: 0
  explanation: |
    正答は「免許状」。hoki-0039 と選択肢の組も正答も同じだが、問われている対象が
    「電波の型式及び周波数」ではなく「識別信号」なので別問題として保持している。
    いずれにせよ運用の根拠は免許状、と覚えれば両方に対応できる。
  law_refs: ["電波法53条"]
  figure: null

- id: hoki-0041
  subject: hoki
  topic: 無線通信の原則（該当しないものを選ぶ）
  variants:
    - source: "2026-02"
      text: |
        一般通信方法における無線通信の原則として無線局運用規則に定める事項に
        該当しないものはどれか。次のうちから選べ。
  choices:
    - 必要のない無線通信は、これを行ってはならない。
    - 無線通信に使用する用語は、できる限り簡潔でなければならない。
    - 無線通信は、長時間継続して行ってはならない。
    - 無線通信を行うときは、自局の識別信号を付して、その出所を明らかにしなければならない。
  answer: 2
  explanation: |
    正答（該当しないもの）は「無線通信は、長時間継続して行ってはならない」。
    通信時間の長さを縛る原則は存在しない。他の3つはいずれも無線局運用規則10条に
    定める原則。hoki-0037・hoki-0038 と違い「該当しないもの」を選ぶ形式なので
    答えが反転する点に注意。
  law_refs: ["無線局運用規則10条"]
  figure: null

- id: hoki-0042
  subject: hoki
  topic: 直ちに受信できない事由があるときの応答
  variants:
    - source: "2024-02"
      text: |
        無線電話通信において、応答に際して直ちに通報を受信することができない事由が
        あるときに応答事項の次に送信することになっている事項はどれか。
        次のうちから選べ。
    - source: "2024-06"
      text: |
        無線電話通信において、応答に際して直ちに通報を受信することができない事由が
        あるときに応答事項の次に送信することになっている事項はどれか。
        次のうちから選べ。
  choices:
    - 「どうぞ」及び通報を受信することができない理由
    - 「どうぞ」及び分で表す概略の待つべき時間
    - 「お待ちください」及び通報を受信することができない理由
    - 「お待ちください」及び分で表す概略の待つべき時間
  answer: 3
  explanation: |
    正答は「「お待ちください」及び分で表す概略の待つべき時間」。
    受信できないのだから「どうぞ」ではなく「お待ちください」。送るのは
    「理由」ではなく「あと何分待てばよいか（分で表す概略の待つべき時間）」。
    2語×2要素の組合せなので、両方を取り違えないよう対で覚える。
  law_refs: ["無線局運用規則23条2項"]
  figure: null

- id: hoki-0043
  subject: hoki
  topic: 応答事項（自局呼出符号の反復回数）
  variants:
    - source: "2024-10"
      text: |
        次の記述は、航空移動業務の無線電話通信における応答事項を掲げたものである。
        無線局運用規則の規定に照らし、＊＊＊内に入れるべき字句を下の番号から選べ。
        ①相手局の呼出符号又は呼出名称　　１回
        ②自局の呼出符号又は呼出名称　　　＊＊＊
  choices:
    - 1回
    - 2回
    - 3回
    - 3回以下
  answer: 0
  explanation: |
    正答は「1回」。応答事項は相手局・自局ともに「1回」。
    呼出事項（hoki-0008）が相手局・自局ともに「3回以下」であるのと対になる。
    ①の欄が「1回」なら応答、「3回以下」なら呼出し、と見分けられる。
  law_refs: ["無線局運用規則154条の2", "無線局運用規則20条"]
  figure: null

- id: hoki-0044
  subject: hoki
  topic: 直ちに通報を受信しようとするときの略語
  variants:
    - source: "2025-02"
      text: |
        無線電話通信において、応答に際して直ちに通報を受信しようとするときに
        応答事項の次に送信する略語はどれか。次のうちから選べ。
    - source: "2025-10"
      text: |
        無線電話通信において、応答に際して直ちに通報を受信しようとするときに
        応答事項の次に送信する略語はどれか。次のうちから選べ。
  choices:
    - どうぞ
    - 了解
    - 受信します
    - OK
  answer: 0
  explanation: |
    正答は「どうぞ」。受信できるときは「どうぞ」、できないときは
    「お待ちください」＋概略の待つべき時間（hoki-0042）。
    「了解」「受信します」「ＯＫ」は規定の略語ではない。
  law_refs: ["無線局運用規則23条1項"]
  figure: null

- id: hoki-0045
  subject: hoki
  topic: 呼出しが他の通信に混信を与えるおそれがあるとき
  variants:
    - source: "2025-06"
      text: |
        無線局が相手局を呼び出そうとする場合（遭難通信等を行う場合を除く。）に
        おいて、他の通信に混信を与えるおそれがあるときは、どうしなければならないか。
        次のうちから選べ。
  choices:
    - 自局の行おうとする通信が長文の内容のものであれば、直ちに呼出しを行う。
    - 5分間以上待って呼出しを行う。
    - 現に通信を行っている他の無線局にその通信の終了時刻を確かめ、終了を待って呼出しを行う。
    - その通信が終了した後に呼出しを行う。
  answer: 3
  explanation: |
    正答は「その通信が終了した後に呼出しを行う」。
    待つべき基準は「何分」でもなく、相手に終了時刻を尋ねることでもなく、
    単に「終わるまで待つ」。呼出し前に混信の有無を確かめるのが大原則。
  law_refs: ["無線局運用規則19条の2"]
  figure: null

- id: hoki-0046
  subject: hoki
  topic: 混信を与える旨の通知を受けたとき
  variants:
    - source: "2026-02"
      text: |
        無線局は、自局の呼出しが他の既に行われている通信に混信を与える旨の通知を
        受けたときは、どうしなければならないか。次のうちから選べ。
  choices:
    - 空中線電力をなるべく小さくして注意しながら呼出しを行う。
    - 直ちにその呼出しを中止する。
    - 混信の度合いが強いときに限り、直ちにその呼出しを中止する。
    - 中止の要求があるまで呼出しを反復する。
  answer: 1
  explanation: |
    正答は「直ちにその呼出しを中止する」。条件も程度も付かず無条件に中止。
    「度合いが強いときに限り」「中止の要求があるまで」「電力を下げて続ける」は
    いずれも条件を付け加えた誤答。
  law_refs: ["無線局運用規則22条"]
  figure: null

- id: hoki-0047
  subject: hoki
  topic: 自局に対する呼出しか確実でない呼出しを受信したとき
  variants:
    - source: "2024-02"
      text: |
        無線電話通信において、無線局は、自局に対する呼出しであることが確実でない
        呼出しを受信したときは、どうしなければならないか。次のうちから選べ。
    - source: "2025-10"
      text: |
        無線電話通信において、無線局は、自局に対する呼出しであることが確実でない
        呼出しを受信したときは、どうしなければならないか。次のうちから選べ。
  choices:
    - その呼出しが数回反復されるまで応答しない。
    - その呼出しが反復され、かつ、自局に対する呼出しであることが確実に判明するまで応答しない。
    - その呼出しが反復され、他のいずれの無線局も応答しないときは直ちに応答する。
    - 直ちに応答し、自局に対する呼出しであることを確かめる。
  answer: 1
  explanation: |
    正答は「その呼出しが反復され、かつ、自局に対する呼出しであることが確実に
    判明するまで応答しない」。宛先が自局かどうかが不確実な場合は応答しない。
    一方、宛先は自局で確実だが「呼出局の符号」が不確実な場合は
    「誰かこちらを呼びましたか」で直ちに応答する（hoki-0009・hoki-0048）。
    どちらが不確実なのかで対応が正反対になるので対で覚える。
  law_refs: ["無線局運用規則26条1項"]
  figure: null

- id: hoki-0048
  subject: hoki
  topic: 呼出局の符号が不確実なときの応答（文で選ぶ）
  variants:
    - source: "2024-06"
      text: |
        無線電話通信において、無線局は、自局に対する呼出しを受信した場合に、
        呼出局の呼出符号又は呼出名称が不確実であるときは、どうしなければならないか。
        次のうちから選べ。
  choices:
    - 呼出局の呼出符号又は呼出名称が確実に判明するまで応答しない。
    - 応答事項のうち相手局の呼出符号又は呼出名称を省略して、直ちに応答する。
    - 応答事項のうち相手局の呼出符号又は呼出名称の代わりに「誰かこちらを呼びましたか」を使用して、直ちに応答する。
    - 応答事項のうち相手局の呼出符号又は呼出名称の代わりに「貴局名は何ですか」を使用して、直ちに応答する。
  answer: 2
  explanation: |
    正答は「応答事項のうち相手局の呼出符号又は呼出名称の代わりに
    「誰かこちらを呼びましたか」を使用して、直ちに応答する」。
    hoki-0009 が略語そのものを選ばせるのに対し、こちらは手順の文ごと選ばせる形式。
    「省略する」「貴局名は何ですか」「判明するまで応答しない」はいずれも誤り。
  law_refs: ["無線局運用規則26条2項"]
  figure: null

- id: hoki-0049
  subject: hoki
  topic: 試験電波発射時の送信時間の制限
  variants:
    - source: "2024-10"
      text: |
        航空移動業務の無線局が無線電話通信において、無線機器の試験又は調整のため
        電波を発射するときの「本日は晴天なり」の連続及び自局の呼出符号又は呼出名称の
        送信は、何秒間を超えてはならないか。次のうちから選べ。
    - source: "2026-02"
      text: |
        航空移動業務の無線局が無線電話通信において、無線機器の試験又は調整のため
        電波を発射するときの「本日は晴天なり」の連続及び自局の呼出符号又は呼出名称の
        送信は、何秒間を超えてはならないか。次のうちから選べ。
    - source: "2026-06"
      text: |
        航空移動業務の無線局が無線電話通信において、無線機器の試験又は調整のため
        電波を発射するときの「本日は晴天なり」の連続及び自局の呼出符号又は呼出名称の
        送信は、何秒間を超えてはならないか。次のうちから選べ。
  choices:
    - 5秒間
    - 10秒間
    - 15秒間
    - 30秒間
  answer: 1
  explanation: |
    正答は「10秒間」。航空移動業務では10秒。一般の無線局の「10秒」と混同しやすい
    誤答として5秒・15秒・30秒が並ぶ。3期で出題された頻出問題。
  law_refs: ["無線局運用規則157条", "無線局運用規則39条"]
  figure: null

- id: hoki-0050
  subject: hoki
  topic: 機器の試験中にしばしば確かめるべきこと
  variants:
    - source: "2025-02"
      text: |
        無線局が電波を発射して行う無線電話の機器の試験中、しばしば確かめなければ
        ならないことはどれか。次のうちから選べ。
  choices:
    - 空中線電力が許容値を超えていないかどうか。
    - 「本日は晴天なり」の連続及び自局の呼出符号又は呼出名称の送信が5秒間を超えていないかどうか。
    - 他の無線局から停止の要求がないかどうか。
    - その電波の周波数の偏差が許容値を超えていないかどうか。
  answer: 2
  explanation: |
    正答は「他の無線局から停止の要求がないかどうか」。
    試験電波は他局に迷惑をかけうるので、発射中は常に止めろと言われていないかを
    確認し続ける。電力や周波数偏差の自己測定を求める規定ではない。
    なお選択肢2の「5秒間」は hoki-0049 の「10秒間」に対する引っかけ。
  law_refs: ["無線局運用規則39条2項"]
  figure: null

- id: hoki-0051
  subject: hoki
  topic: 義務航空機局の運用義務時間
  variants:
    - source: "2024-02"
      text: |
        義務航空機局の運用義務時間として無線局運用規則に定められているものはどれか。
        次のうちから選べ。
    - source: "2026-06"
      text: |
        義務航空機局の運用義務時間として無線局運用規則に定められているものはどれか。
        次のうちから選べ。
  choices:
    - 航空機の航行の準備中常時
    - 航空機の航行中及び航行の準備中常時
    - 航空機の航行中常時
    - 航空機の出発準備から離陸までの時間中及び着陸準備から着陸までの時間中常時
  answer: 2
  explanation: |
    正答は「航空機の航行中常時」。義務航空機局が開いていなければならないのは
    「航行中」だけ。紛らわしいのは hoki-0052（航空機局を運用してよい範囲）が
    「航行中及び航行の準備中」である点。
    運用「義務」＝航行中常時／運用「できる範囲」＝航行中及び航行の準備中、と対で覚える。
  law_refs: ["無線局運用規則146条1項"]
  figure: null

