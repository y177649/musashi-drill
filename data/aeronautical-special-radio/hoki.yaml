- id: hoki-0054
  subject: hoki
  topic: 121.5MHzの使用条件（急迫の危険状態）
  variants:
    - source: "2024-06"
      text: |
        １２１.５ＭＨｚの周波数の電波を使用することができるのはどの場合か。
        次のうちから選べ。
    - source: "2025-10"
      text: |
        １２１.５ＭＨｚの周波数の電波を使用することができるのはどの場合か。
        次のうちから選べ。
  choices:
    - 気象の照会のために航空局と航空機局との間において通信を行うとき。
    - 急迫の危険状態にある航空機の航空機局と航空局との間に通信を行う場合で、通常使用する電波が不明であるとき又は他の航空機局のために使用されているとき。
    - 時刻の照合のために航空機局相互間において通信を行うとき。
    - 電波の規正に関する通信を行うとき。
  answer: 1
  explanation: |
    正答は「急迫の危険状態にある航空機の航空機局と航空局との間に通信を行う場合で、
    通常使用する電波が不明であるとき又は他の航空機局のために使用されているとき」。
    121.5MHz は非常用の周波数なので、気象の照会・時刻の照合・電波の規正といった
    平常の用途には使えない。hoki-0011 と設問文は同一だが選択肢の組も正答も違うので
    別問題として保持している（hoki-0011 の正答は「121.5MHz 以外の電波を使用できない
    航空機局と航空局との間の通信」）。
  law_refs: ["無線局運用規則153条1項"]
