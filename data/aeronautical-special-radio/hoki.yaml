    正答は「航行中及び航行の準備中」。義務航空機局の運用義務時間
    （hoki-0051＝航行中常時）と取り違えやすい。こちらは「運用してよい範囲」なので
    出発前の準備中も含む、と理解すると区別しやすい。3期連続の頻出問題。
