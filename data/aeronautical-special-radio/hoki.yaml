  figure: null

- id: hoki-0003
  subject: hoki
  topic: 航空特殊無線技士の操作範囲（空中線電力）
  variants:
    - source: "2023-10"
      text: |
        航空特殊無線技士の資格を有する者が、航空機局（航空運送事業の用に供する
        航空機のものを除く。）の２５,０１０ｋＨｚ以上の周波数の電波を使用する
        無線電話の国内通信のための通信操作を行うことができるのは、空中線電力
        何ワット以下のものか。次のうちから選べ。
    - source: "2025-10"
      text: |
        航空特殊無線技士の資格を有する者が、航空機局（航空運送事業の用に供する
        航空機のものを除く。）の２５,０１０ｋＨｚ以上の周波数の電波を使用する
        無線電話の国内通信のための通信操作を行うことができるのは、空中線電力
        何ワット以下のものか。次のうちから選べ。
  choices:
    - 50ワット
    - 100ワット
    - 5ワット
    - 10ワット
  answer: 0
  explanation: |
    正答は「50ワット」。航空特殊無線技士が扱える航空機局の空中線電力の上限として
    出題される定番の数字。
  law_refs: ["電波法施行令 別表第2(条文要確認)"]
  figure: null

- id: hoki-0004
  subject: hoki
  topic: 電波発射停止命令後の措置
  variants:
    - source: "2023-10"
      text: |
        総務大臣から臨時に電波の発射の停止の命令を受けた無線局は、その発射する
        電波の質を総務省令に適合するように措置したときは、どうしなければならないか。
        次のうちから選べ。
    - source: "2024-06"
      text: |
        総務大臣から臨時に電波の発射の停止の命令を受けた無線局は、その発射する
        電波の質を総務省令に適合するように措置したときは、どうしなければならないか。
        次のうちから選べ。
  choices:
    - 直ちにその電波を発射する。
    - その旨を総務大臣に申し出る。
    - 電波の発射について総務大臣の許可を受ける。
    - 他の無線局の通信に混信を与えないことを確かめた後、電波を発射する。
  answer: 1
  explanation: |
    正答は「その旨を総務大臣に申し出る」。措置しただけでは発射を再開できず、
    総務大臣への申出を経て試験的に発射させてもらう、という流れ（電波法72条2項）。
    「直ちに発射」「自分で確認して発射」はいずれも総務大臣の関与を飛ばしている点で誤り。
  law_refs: ["電波法72条2項"]
  figure: null

- id: hoki-0005
  subject: hoki
  topic: 電波法違反に対する処分
  variants:
    - source: "2023-10"
      text: |
        無線局の免許人が電波法又は電波法に基づく命令に違反したときに総務大臣が
        行うことができる処分はどれか。次のうちから選べ。
    - source: "2026-06"
      text: |
        無線局の免許人が電波法又は電波法に基づく命令に違反したときに総務大臣が
        行うことができる処分はどれか。次のうちから選べ。
  choices:
    - 再免許の拒否
    - 通信の相手方又は通信事項の制限
    - 電波の型式の制限
    - 無線局の運用の停止
  answer: 3
  explanation: |
    正答は「無線局の運用の停止」（電波法76条）。3箇月以内の期間を定めて運用停止を
    命じることができる、という条文。他の選択肢は電波法上の別の場面の処分と紛らわしく
    作られている誤答パターン。
  law_refs: ["電波法76条"]
  figure: null

- id: hoki-0006
  subject: hoki
  topic: 免許状の返納
  variants:
    - source: "2023-10"
      text: |
        無線局の免許がその効力を失ったときは、免許人であった者は、その免許状を
        どうしなければならないか。次のうちから選べ。
    - source: "2024-06"
      text: |
        無線局の免許がその効力を失ったときは、免許人であった者は、その免許状を
        どうしなければならないか。次のうちから選べ。
  choices:
    - 3箇月以内に総務大臣に返納する。
    - 2年間保管する。
    - 1箇月以内に総務大臣に返納する。
    - 直ちに廃棄する。
  answer: 2
  explanation: |
    正答は「1箇月以内に総務大臣に返納する」（電波法24条）。「◯箇月以内に返納」の
    ◯の部分（1箇月）が問われる頻出パターン。
  law_refs: ["電波法24条"]
  figure: null

- id: hoki-0007
  subject: hoki
  topic: 機器の試験・調整時に使用すべき装置
  variants:
    - source: "2023-10"
      text: |
        無線局が、無線設備の機器の試験又は調整を行うために運用するときに、
        なるべく使用しなければならないものはどれか。次のうちから選べ。
    - source: "2025-02"
      text: |
        無線局が、無線設備の機器の試験又は調整を行うために運用するときに、
        なるべく使用しなければならないものはどれか。次のうちから選べ。
    - source: "2025-10"
      text: |
        無線局が、無線設備の機器の試験又は調整を行うために運用するときに、
        なるべく使用しなければならないものはどれか。次のうちから選べ。
    - source: "2026-06"
      text: |
        無線局が、無線設備の機器の試験又は調整を行うために運用するときに、
        なるべく使用しなければならないものはどれか。次のうちから選べ。
  choices:
    - 空中線電力の低下装置
    - 高調波除去装置
    - 擬似空中線回路
    - 水晶発振回路
  answer: 2
  explanation: |
    正答は「擬似空中線回路」。試験・調整中に実際の電波を発射して他局へ混信を
    与えないようにするための仕組み。
  law_refs: ["電波法57条"]
  figure: null

- id: hoki-0008
  subject: hoki
  topic: 呼出事項（自局呼出符号の反復回数）
  variants:
    - source: "2023-10"
      text: |
        次の記述は、航空移動業務の無線電話通信における呼出事項を掲げたものである。
        無線局運用規則の規定に照らし、＊＊＊内に入れるべき字句を下の番号から選べ。
        ① 相手局の呼出符号又は呼出名称　3回以下
        ② 自局の呼出符号又は呼出名称　＊＊＊
    - source: "2026-06"
      text: |
        次の記述は、航空移動業務の無線電話通信における呼出事項を掲げたものである。
        無線局運用規則の規定に照らし、＊＊＊内に入れるべき字句を下の番号から選べ。
        ① 相手局の呼出符号又は呼出名称　3回以下
        ② 自局の呼出符号又は呼出名称　＊＊＊
  choices:
    - 2回
    - 3回以下
    - 1回
    - 2回以下
  answer: 1
  explanation: |
    正答は「3回以下」。相手局・自局とも呼出符号（呼出名称）は3回以下、という
    対称的なルール。
  law_refs: ["無線局運用規則(条文要確認)"]
  figure: null

