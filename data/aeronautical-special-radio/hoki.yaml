  choices:
    - その航空機を運行する者にその旨を通知する。
    - 航空交通管制の機関にその旨を通知する。
    - 遭難通信を宰領した無線局にその旨を通知する。
    - 直ちに責任航空局にその旨を通知する。
  answer: 2
  explanation: |
    正答は「遭難通信を宰領した無線局にその旨を通知する」。
    括弧書きで「遭難通信を宰領したものを除く」とあるのがヒントで、
    宰領していたのは別の局なのだから、終わったことをその宰領局に伝える。
    遭難通報を受けた側の通知先（航空交通管制の機関）とは別物。3期連続の頻出問題。
  law_refs: ["無線局運用規則175条の2(条文要確認)"]
  figure: null

- id: hoki-0061
  subject: hoki
  topic: 遭難通報の送信事項（該当しないものを選ぶ）
  variants:
    - source: "2026-02"
      text: |
        遭難航空機局が遭難通報を送信する場合の送信事項に該当しないものはどれか。
