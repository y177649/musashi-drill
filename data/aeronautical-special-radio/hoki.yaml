  choices:
    - 遭難した航空機の識別又は遭難航空機局の呼出符号若しくは呼出名称
    - 遭難の種類及び遭難した航空機の機長のとろうとする措置
    - 遭難した航空機の位置、高度及び針路
    - 遭難した航空機の乗員の氏名
  answer: 3
  explanation: |
    正答（該当しないもの）は「遭難した航空機の乗員の氏名」。
    遭難通報に載せるのは救助に直結する情報（どの機か・何が起きたか・機長の措置・
    位置／高度／針路など）であって、乗員の氏名は含まれない。
