        航空局又は航空機局は、連絡設定後であって＊＊＊のおそれがないときは、当該
        航空機局の呼出符号又は呼出名称に代えて、総務大臣が別に告示する簡易な識別表示を
        使用することができる。ただし、航空機局は、航空局から当該識別表示により呼出しを
        受けた後でなければこれを使用することができない。
