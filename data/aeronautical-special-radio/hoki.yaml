  answer: 0
  explanation: |
    正答は「緊急の度に応じ、緊急通信に次いでその順位を適宜に選ぶことができる」。
    hoki-0056 の穴埋め形式を、文ごと選ばせる形に変えたもの。
    覚える内容は同じ「緊急通信に次いで」。
  law_refs: ["無線局運用規則150条"]
  figure: null

- id: hoki-0058
  subject: hoki
  topic: 緊急通報に対し応答した航空機局の措置
  variants:
    - source: "2024-02"
      text: |
        航空機の緊急の事態に係る緊急通報に対し応答した航空機局はどうしなければ
        ならないか。次のうちから選べ。
    - source: "2024-06"
      text: |
        航空機の緊急の事態に係る緊急通報に対し応答した航空機局はどうしなければ
        ならないか。次のうちから選べ。
  choices:
    - 直ちに航空交通管制の機関に緊急の事態の状況を通知する。
    - 直ちに緊急の事態にある航空機を運行する者に緊急の事態の状況を通知する。
    - 必要に応じ、当該緊急通信の宰領を行う。
    - 直ちに付近を航行する航空機の航空機局に緊急の事態の状況を通知する。
  answer: 0
  explanation: |
    正答は「直ちに航空交通管制の機関に緊急の事態の状況を通知する」。
    通知先は運航者でも付近の航空機でもなく、航空交通管制の機関。
    遭難通報の場合（hoki-0059）も通報先は同じく航空交通管制の機関で、
    「緊急・遭難いずれも管制機関へ」と揃えて覚えられる。
  law_refs: ["無線局運用規則176条の2(条文要確認)"]
  figure: null

- id: hoki-0059
  subject: hoki
  topic: 遭難通報に対し応答した航空機局の措置
  variants:
    - source: "2024-10"
      text: |
        航空機の遭難に係る遭難通報に対し応答した航空機局はどうしなければならないか。
        次のうちから選べ。
    - source: "2025-06"
      text: |
        航空機の遭難に係る遭難通報に対し応答した航空機局はどうしなければならないか。
        次のうちから選べ。
  choices:
    - 直ちに遭難に係る航空機を運行する者に遭難の状況を通知する。
    - 付近を航行中の航空機に遭難の状況を通知する。
    - 救助上適当と認められる無線局に対し、当該遭難通報の送信を要求する。
    - 直ちに当該遭難通報を航空交通管制の機関に通報する。
  answer: 3
  explanation: |
    正答は「直ちに当該遭難通報を航空交通管制の機関に通報する」。
    自分で救助を差配するのではなく、まず管制機関へ上げる。
    緊急通報の場合（hoki-0058）と通知先が同じ。
  law_refs: ["無線局運用規則171条の3(条文要確認)"]
  figure: null

