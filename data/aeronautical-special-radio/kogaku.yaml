  subject: kogaku
  topic: 電力の計算(抵抗値から)
  variants:
    - source: "2024-10"
      text: |
        2〔A〕の電流を流すと40〔W〕の電力を消費する抵抗器がある。これに100〔V〕の電圧を加えたとき、消費される電力の値として正しいのはどれか。次のうちから選べ。
  choices:
    - "50〔W〕"
    - "250〔W〕"
    - "500〔W〕"
    - "1,000〔W〕"
  answer: 3
  explanation: |
    正答は「1,000〔W〕」。まず抵抗値を求める。P＝I²R より 40＝2²×R、R＝10〔Ω〕。
    次に100〔V〕を加えたときの電力は P＝E²/R＝100²/10＝10,000/10＝1,000〔W〕。
    与えられた電流と電力から抵抗を出し、それを電圧の式に入れるという
    2段階の計算になっている点がポイント。
