# 航空特殊無線技士「無線工学」問題データ
#
# 出典：電波受験界（情報通信振興会 jyukenkai.com）公開の過去問PDF。
# variants.text は実際に出題された文言をそのまま転記したもののみを追加すること。
# AIによる新規文面の生成・言い換えでの水増しは禁止（過去問のバリエーション以外は載せない）。
# choices の文言は全件、原本OCR（_source/txt/*.txt）との機械照合で出典を確認済み。
#
# 図（回路図・ブロック図・パネル図）を読まないと解けない設問は、figure 未対応のため
# 本ファイルには収録していない。図が装飾的で選択肢だけで判断できるものは収録している。
# 法規と異なり条文参照が無いため law_refs は持たない。
#
# 同一 id にまとめるのは stem・choices・正答がすべて一致する回のみ。
# 例えば ATC トランスポンダの ALT 位置を問う設問は、2024-06 が「TST」、
# 2026-06 が「TEST」と選択肢の実文言そのものが異なるため、あえて別 id としている。
# explanation は過去問の文言ではなく解説として書き起こしたもの。

- id: kogaku-0001
  subject: kogaku
  topic: 電力の計算(電圧比)
  variants:
    - source: "2023-10"
      text: |
        図に示す電気回路において、電源電圧Eの大きさを4分の1倍(1/4倍)にすると、抵抗Rで消費される電力は、何倍になるか。次のうちから選べ。
  choices:
    - "1/2倍"
    - "1/4倍"
    - "1/16倍"
    - "1/32倍"
  answer: 2
  explanation: |
    正答は「1/16倍」。抵抗で消費される電力は P＝E²/R で、電圧の2乗に比例する。
    E を 1/4 倍にすると P は (1/4)²＝1/16 倍になる。
    「1/4倍」を選ばせるのがこの問題の最大の引っかけ。電力は電圧に比例ではなく
    2乗に比例する、とだけ覚えておけば確実に解ける。
  figure: null

- id: kogaku-0002
  subject: kogaku
  topic: 半導体の温度特性
  variants:
    - source: "2023-10"
      text: |
        半導体を用いた電子部品の温度が上昇すると、一般にその部品に起こる変化として、正しいのはどれか。次のうちから選べ。
  choices:
    - "半導体の抵抗が減少し、電流が減少する。"
    - "半導体の抵抗が減少し、電流が増加する。"
    - "半導体の抵抗が増加し、電流が増加する。"
    - "半導体の抵抗が増加し、電流が減少する。"
  answer: 1
  explanation: |
    正答は「半導体の抵抗が減少し、電流が増加する」。
    半導体は金属導体と逆で、温度が上がると価電子帯から伝導帯へ励起される
    キャリアが増えるため抵抗が減る(負の温度係数)。抵抗が減れば同じ電圧でも
    オームの法則 I＝E/R により電流は増える。
    「金属とは逆」「抵抗↓なら電流↑」の2段階で判断すれば迷わない。
  figure: null

- id: kogaku-0003
  subject: kogaku
  topic: マイクロ波(SHF)帯の伝搬
  variants:
    - source: "2023-10"
      text: |
        レーダーでは、一般にマイクロ波(SHF)帯の電波が利用されるが、通常この電波の伝わり方は、次のうちどれに含められるか。下の番号から選べ。
  choices:
    - "直接波"
    - "地表波"
    - "大地反射波"
    - "電離層波"
  answer: 0
  explanation: |
    正答は「直接波」。マイクロ波(SHF)帯は波長が短く直進性が強い一方、
    電離層を突き抜けてしまうため電離層波にはならず、大地に吸収されるので
    地表波としてもほとんど伝わらない。したがって送受信点を見通す直接波が主体となる。
    レーダーが見通し距離内しか探知できないのはこのため。
  figure: null

- id: kogaku-0004
  subject: kogaku
  topic: 整流回路と平滑回路
  variants:
    - source: "2023-10"
      text: |
        交流電源から直流を得る場合は、変圧器により所要の電圧にした後、Aを経てBでできるだけ完全な直流にする。
  choices:
    - "平滑回路、変調回路"
    - "整流回路、平滑回路"
    - "変調回路、平滑回路"
    - "平滑回路、整流回路"
  answer: 1
  explanation: |
    正答は「A＝整流回路、B＝平滑回路」。直流電源装置は
    変圧器(電圧を所要値へ)→整流回路(交流を一方向の脈流へ)→平滑回路
    (脈流の変動を取り除きほぼ完全な直流へ)の順に並ぶ。
    順序を入れ替えた選択肢や、無関係な「変調回路」を混ぜた選択肢が誤り。
    この3段構成の順番はそのまま覚えること。
  figure: null

- id: kogaku-0005
  subject: kogaku
  topic: AM/FM変調で変化させる搬送波の要素
  variants:
    - source: "2023-10"
      text: |
        AM変調は、信号波に応じて搬送波のAを変化させる。FM変調は、信号波に応じて搬送波のBを変化させる。
  choices:
    - "周波数、振幅"
    - "振幅、周波数"
    - "周波数、周波数"
    - "振幅、振幅"
  answer: 1
  explanation: |
    正答は「A＝振幅、B＝周波数」。AM(Amplitude Modulation)は振幅変調、
    FM(Frequency Modulation)は周波数変調であり、名称がそのまま答えになっている。
    英語の頭文字を思い出せば暗記不要。選択肢はA・Bの並びを入れ替えただけの
    4通りなので、取り違えにだけ注意する。
  figure: null

- id: kogaku-0006
  subject: kogaku
  topic: 機上気象レーダー調整器の機能(ANT TILTの識別)
  variants:
    - source: "2023-10"
      text: |
        次の記述は、機上気象レーダーのパネル面にある調整器の機能について述べたものである。その機能に適した調整器はどれか。レーダーアンテナの傾斜角を制御するもので、機軸に対して所定の傾斜角にセットすることができる。
  choices:
    - "GAIN"
    - "RANGE"
    - "STAB - OFF"
    - "ANT TILT"
  answer: 3
  explanation: |
    正答は「ANT TILT」。ANT TILT は ANTenna TILT、すなわちアンテナの傾斜角
    (上下方向の向き)を機軸に対して設定する調整器。
    GAIN は受信利得(映像の感度)、RANGE は測定距離範囲の切替、
    STAB-OFF は姿勢安定(スタビライズ)機能の停止であり、いずれも傾斜角とは無関係。
  figure: null

- id: kogaku-0007
  subject: kogaku
  topic: SSRモードSのアドレス指定と両立性
  variants:
    - source: "2023-10"
      text: |
        SSRモードSシステムは、目的とする航空機に対しAを指定して質問ができるため、従来型のSSRモードA/Cで発生した干渉障害を抑制し、信頼性の高い情報により、航空交通管制の信頼性が向上している。この方式は、従来型とのBシステムである。
    - source: "2025-06"
      text: |
        SSRモードSシステムは、目的とする航空機に対しAを指定して質問ができるため、従来型のSSRモードA/Cで発生した干渉障害を抑制し、信頼性の高い情報により、航空交通管制の信頼性が向上している。この方式は、従来型とのBシステムである。
  choices:
    - "アドレス、両立性がある"
    - "アドレス、両立性がない"
    - "時間、両立性がある"
    - "時間、両立性がない"
  answer: 0
  explanation: |
    正答は「A＝アドレス、B＝両立性がある」。モードSの S は Select(選択)で、
    機体ごとに固有の24ビットアドレスを持ち、目的の航空機だけを名指しで
    質問できる。これにより全機が一斉応答することによる干渉(フルーツ・ガーブル)
    を抑えられる。また従来のモードA/C質問にも応答できるよう設計されており、
    既存設備との両立性がある。
  figure: null

- id: kogaku-0008
  subject: kogaku
  topic: ATCトランスポンダのアイデント・ボタンの目的
  variants:
    - source: "2023-10"
      text: |
        ATCトランスポンダの操作でアイデント・ボタンを押す目的はどれか。次のうちから選べ。
  choices:
    - "モードAの信号を受信したが、自動的に応答できないことを管制官に知らせる。"
    - "TESTの切換で、装置の動作の良否が確かめられないことを管制官に知らせる。"
    - "管制官からの識別のための要請により、SPI(特別位置識別)パルスの送信を行う。"
    - "モードCの信号を受信したが、自動的に応答できないことを管制官に知らせる。"
  answer: 2
  explanation: |
    正答は「管制官からの識別のための要請により、SPI(特別位置識別)パルスの送信を行う」。
    アイデント・ボタンは管制官の「Squawk ident」の指示に応じて押すもので、
    レーダー画面上で自機のターゲットを目立たせるSPIパルスを一定時間送出する。
    他の選択肢はいずれも「応答できないことを知らせる」という存在しない機能で、
    アイデント・ボタンの役割ではない。
  figure: null

- id: kogaku-0009
  subject: kogaku
  topic: 受信機の性能の定義(誤り選択:感度)
  variants:
    - source: "2023-10"
      text: |
        受信機の性能についての説明で、誤っているのはどれか。次のうちから選べ。
  choices:
    - "選択度は、多数の異なる周波数の電波の中から混信を受けないで、目的とする電波を選びだすことができるかの能力を表す。"
    - "忠実度は、受信する信号が受信機の出力側でどれだけ忠実に再現できるかの能力を表す。"
    - "安定度は、周波数及び強さが一定の電波を受信したとき、再調整をしないで、どれだけ長時間にわたって、一定の出力が得られるかの能力を表す。"
    - "感度は、どれだけ強い電波まで受信できるかの能力を表す。"
  answer: 3
  explanation: |
    正答(誤っているもの)は「感度は、どれだけ強い電波まで受信できるかの能力を表す」。
    感度は逆に、どれだけ弱い電波まで受信できるかを表す。
    選択度(混信の中から目的波を選び出す)、忠実度(入力信号を出力でどれだけ
    忠実に再現できるか)、安定度(長時間一定の出力が得られるか)の3つは正しい説明。
    受信機の4性能はこの組合せで繰り返し出題される。
  figure: null

- id: kogaku-0010
  subject: kogaku
  topic: 緩衝増幅器の目的
  variants:
    - source: "2023-10"
      text: |
        送信機の緩衝増幅器は、どのような目的で設けられているか。次のうちから選べ。
  choices:
    - "所要の送信機出力まで増幅するため。"
    - "後段の影響により発振器の発振周波数が変動するのを防ぐため。"
    - "発振周波数の整数倍の周波数を取り出すため。"
    - "終段増幅器の入力として十分な励振電圧を得るため。"
  answer: 1
  explanation: |
    正答は「後段の影響により発振器の発振周波数が変動するのを防ぐため」。
    緩衝(バッファ)増幅器は発振器と次段の間に入れ、後段の負荷変動が発振器へ
    逆流するのを遮断する。これがないと送信操作のたびに周波数が動いてしまう。
    「所要の出力まで増幅」は電力増幅器、「整数倍の周波数を取り出す」は
    周波数逓倍器、「終段への励振電圧を得る」は励振増幅器の役割。
  figure: null

- id: kogaku-0011
  subject: kogaku
  topic: 電力の計算(電圧比)
  variants:
    - source: "2024-02"
      text: |
        図に示す電気回路において、電源電圧Eの大きさを4分の1倍(1/4倍)にすると、抵抗Rで消費される電力は、何倍になるか。次のうちから選べ。
  choices:
    - "1/2倍"
    - "1/4倍"
    - "1/8倍"
    - "1/16倍"
  answer: 3
  explanation: |
    正答は「1/16倍」。P＝E²/R より電力は電圧の2乗に比例するので、
    E を 1/4 倍にすると (1/4)²＝1/16 倍になる。
    同じ問題が選択肢の並びを変えて繰り返し出題されており、
    番号ではなく「1/16倍」という値で覚えること。
  figure: null

- id: kogaku-0012
  subject: kogaku
  topic: FET/接合形トランジスタの電極対応
  variants:
    - source: "2024-02"
      text: |
        電界効果トランジスタ(FET)の電極と一般の接合形トランジスタの電極の組合せで、その働きが対応しているのはどれか。次のうちから選べ。
  choices:
    - "ドレイン、ベース"
    - "ドレイン、エミッタ"
    - "ゲート、ベース"
    - "ソース、コレクタ"
  answer: 2
  explanation: |
    正答は「ゲート、ベース」。FETと接合形トランジスタの電極は
    ゲート↔ベース(入力・制御)、ドレイン↔コレクタ(出力)、ソース↔エミッタ(共通)
    が対応する。頭文字で G-B、D-C、S-E と3組まとめて覚えるとよい。
    選択肢はこの対応を1つずつずらした誤りになっている。
  figure: null

- id: kogaku-0013
  subject: kogaku
  topic: レーダー最大探知距離
  variants:
    - source: "2024-02"
      text: |
        レーダーの最大探知距離を長くする方法として、誤っているのはどれか。次のうちから選べ。
  choices:
    - "アンテナの設置位置を高くし、アンテナ利得を大きくする。"
    - "送信電力を大きくする。"
    - "パルス幅を狭くし、パルス繰返し周波数を高くする。"
    - "受信機の感度を良くする。"
  answer: 2
  explanation: |
    正答(誤っているもの)は「パルス幅を狭くし、パルス繰返し周波数を高くする」。
    最大探知距離を伸ばすにはパルス幅を広くして1パルスあたりの送信エネルギーを
    増やし、遠方からの反射が返るまで待てるようパルス繰返し周波数は低くする。
    パルス幅を狭くするのは最小探知距離・距離分解能を良くする方法であり、
    最大探知距離はかえって短くなる。他の3つ(送信電力↑、アンテナ高・利得↑、
    受信感度↑)はいずれも正しい方法。
  figure: null

- id: kogaku-0014
  subject: kogaku
  topic: 蓄電池の並列接続
  variants:
    - source: "2024-02"
      text: |
        1個6〔V〕、30〔Ah〕の蓄電池を3個並列に接続した場合の合成電圧及び合成容量の組合せで、正しいのはどれか。次のうちから選べ。
  choices:
    - "6〔V〕、90〔Ah〕"
    - "6〔V〕、30〔Ah〕"
    - "18〔V〕、90〔Ah〕"
    - "18〔V〕、30〔Ah〕"
  answer: 0
  explanation: |
    正答は「6〔V〕、90〔Ah〕」。並列接続では電圧は1個のときと同じままで、
    容量(電流を供給できる量)が個数分だけ加算される。6〔V〕はそのまま、
    30〔Ah〕×3＝90〔Ah〕。直列接続(電圧が加算され容量は変わらない)との
    違いを問う問題が対で出るので、「直列＝電圧が増える／並列＝容量が増える」
    と覚える。
  figure: null

- id: kogaku-0015
  subject: kogaku
  topic: 密閉型ヒューズの断線確認(アナログテスタ)
  variants:
    - source: "2024-02"
      text: |
        アナログ方式の回路計(テスタ)を用いて密閉型ヒューズ単体の断線を確かめるには、どの測定レンジを使用すればよいか。次のうちから選べ。
  choices:
    - "DC MILLI AMPERES"
    - "DC VOLTS"
    - "AC VOLTS"
    - "OHMS"
  answer: 3
  explanation: |
    正答は「OHMS」。密閉型ヒューズは中が見えないため、抵抗レンジ(OHMS)で
    導通を調べる。正常なら抵抗はほぼ0〔Ω〕、断線していれば∞を示す。
    測定は必ず回路から外し電圧がかかっていない状態で行う。
    DC VOLTS・AC VOLTS は電圧、DC MILLI AMPERES は電流の測定レンジで、
    単体の部品の導通確認には使えない。
  figure: null

- id: kogaku-0016
  subject: kogaku
  topic: GPSについての記述(誤り選択:LF帯)
  variants:
    - source: "2024-02"
      text: |
        GPS(Global Positioning System)についての記述として、誤っているのはどれか。次のうちから選べ。
    - source: "2026-06"
      text: |
        GPS(Global Positioning System)についての記述として、誤っているのはどれか。次のうちから選べ。
  choices:
    - "GPSでは、地上からの高度が約20,000〔km〕の異なる6つの軌道上に衛星が配置されている。"
    - "各衛星は、一周約12時間で周回している。"
    - "一般に、任意の4個の衛星からの電波が受信できれば、測位は可能である。"
    - "測位に使用している周波数は、長波(LF)帯である。"
  answer: 3
  explanation: |
    正答(誤っているもの)は「測位に使用している周波数は、長波(LF)帯である」。
    GPSが使うのは 1.2〜1.5〔GHz〕台、すなわち極超短波(UHF)帯である。
    他の3つは正しい: 高度約20,000〔km〕の6つの軌道面、周回周期は約12時間、
    測位には最低4個の衛星(3次元位置3つ＋受信機時計の誤差1つ、計4未知数)が必要。
    この4つの数字はGPS問題で繰り返し問われる。
  figure: null

- id: kogaku-0017
  subject: kogaku
  topic: SSR設備の分類(二次レーダー)
  variants:
    - source: "2024-02"
      text: |
        航空交通管制用として地上に設置されているSSR設備は、次のうち、どれに含まれるか。下の番号から選べ。
  choices:
    - "一次レーダー"
    - "二次レーダー"
    - "CWレーダー"
    - "ドプラレーダー"
  answer: 1
  explanation: |
    正答は「二次レーダー」。SSR(Secondary Surveillance Radar)は名称どおり
    二次レーダーで、地上から質問信号を出し、航空機のATCトランスポンダが
    電波を送り返すことで情報を得る。物標に当たった反射波を受ける通常の
    レーダーが一次レーダー。CWレーダー・ドプラレーダーは一次レーダーの一種。
  figure: null

- id: kogaku-0018
  subject: kogaku
  topic: ATCトランスポンダの動作(MTI/モードC×高度/速度)
  variants:
    - source: "2024-02"
      text: |
        次の記述は、ATCトランスポンダの動作について述べたものである。SSRからのAの質問信号に対し自動的にBの情報パルスを応答信号として送信することができる。
    - source: "2025-06"
      text: |
        次の記述は、ATCトランスポンダの動作について述べたものである。SSRからのAの質問信号に対し自動的にBの情報パルスを応答信号として送信することができる。
  choices:
    - "MTI、高度"
    - "MTI、速度"
    - "モードC、高度"
    - "モードC、速度"
  answer: 2
  explanation: |
    正答は「A＝モードC、B＝高度」。モードCは高度情報を要求する質問モードで、
    トランスポンダは気圧高度の情報パルスを自動的に応答する。
    識別(便名に対応するコード)を要求するのはモードA。
    MTIは移動目標指示装置のことで質問モードではないため、MTIを含む選択肢は
    その時点で誤り。「C＝高度(Ceiling)」と語呂で覚えるとよい。
  figure: null

- id: kogaku-0019
  subject: kogaku
  topic: VHF送受信装置の良好な受信のための機能(スケルチ)
  variants:
    - source: "2024-02"
      text: |
        航空用VHF送受信装置の機能で、受信待受時に雑音が聞こえないように調整し、良好な受信を行うものはどれか。次のうちから選べ。
  choices:
    - "音量調整"
    - "スケルチ"
    - "チャネル切換"
    - "電源スイッチ"
  answer: 1
  explanation: |
    正答は「スケルチ」。スケルチは受信入力が一定レベル以下のときに低周波増幅を
    止め、無信号時の「ザー」という雑音をスピーカに出さない機能。
    音量調整は音の大きさ、チャネル切換は周波数の選択、電源スイッチは入切であり、
    いずれも雑音抑止の機能ではない。
  figure: null

- id: kogaku-0020
  subject: kogaku
  topic: コンデンサの静電容量
  variants:
    - source: "2024-06"
      text: |
        コンデンサの静電容量の大きさは、絶縁物の種類によって異なるが、両金属板の向かい合っている面積がAほど、また、間隔がBほど大きくなる。
  choices:
    - "小さい、狭い"
    - "小さい、広い"
    - "大きい、狭い"
    - "大きい、広い"
  answer: 2
  explanation: |
    正答は「A＝大きい、B＝狭い」。平行平板コンデンサの静電容量は
    C＝ε S/d で、向かい合う面積 S に比例し、極板間隔 d に反比例する。
    したがって面積が大きいほど、間隔が狭いほど容量は大きい。
    式を覚えていなくても「電荷を蓄える板は広く近いほどよく蓄えられる」と
    イメージすれば判断できる。
  figure: null

- id: kogaku-0021
  subject: kogaku
  topic: 電波の伝搬距離
  variants:
    - source: "2024-06"
      text: |
        自由空間において、電波が20〔μs〕の間に伝搬する距離はどれか。次のうちから選べ。
  choices:
    - "6〔km〕"
    - "3〔km〕"
    - "2〔km〕"
    - "1〔km〕"
  answer: 0
  explanation: |
    正答は「6〔km〕」。電波は自由空間を光速 3×10⁸〔m/s〕で伝わるので、
    3×10⁸〔m/s〕×20×10⁻⁶〔s〕＝6×10³〔m〕＝6〔km〕。
    「1〔μs〕で約300〔m〕進む」を覚えておけば、300〔m〕×20＝6,000〔m〕と
    暗算できる。レーダーの距離計算にもそのまま使える基本値。
  figure: null

- id: kogaku-0022
  subject: kogaku
  topic: レーダーの方位分解能(定義選択)
  variants:
    - source: "2024-06"
      text: |
        レーダーから等距離にあって、近接した2物標が区別できる限界の能力を表すものはどれか。次のうちから選べ。
  choices:
    - "最小探知距離"
    - "距離分解能"
    - "最大探知距離"
    - "方位分解能"
  answer: 3
  explanation: |
    正答は「方位分解能」。「等距離にあって近接した2物標」を区別する能力は
    方位(角度)方向の分離能力なので方位分解能で、アンテナの水平面内指向性
    (ビーム幅)で決まる。
    同じ方位で距離の近い2物標を区別する能力は距離分解能でパルス幅が効く。
    「等距離→方位分解能」「同方位→距離分解能」と対にして覚える。
  figure: null

- id: kogaku-0023
  subject: kogaku
  topic: 蓄電池の直列接続(12V×2)
  variants:
    - source: "2024-06"
      text: |
        1個12〔V〕、30〔Ah〕の蓄電池を2個直列に接続した場合の合成電圧及び合成容量の組合せで、正しいのはどれか。次のうちから選べ。
    - source: "2024-10"
      text: |
        1個12〔V〕、30〔Ah〕の蓄電池を2個直列に接続した場合の合成電圧及び合成容量の組合せで、正しいのはどれか。次のうちから選べ。
  choices:
    - "24〔V〕、60〔Ah〕"
    - "24〔V〕、30〔Ah〕"
    - "12〔V〕、60〔Ah〕"
    - "12〔V〕、30〔Ah〕"
  answer: 1
  explanation: |
    正答は「24〔V〕、30〔Ah〕」。直列接続では電圧が加算され、容量は1個のときと
    変わらない。12〔V〕×2＝24〔V〕、容量は30〔Ah〕のまま。
    並列接続(電圧そのまま・容量が加算)と対で出題されるので、
    「直列＝電圧が増える／並列＝容量が増える」と整理しておく。
  figure: null

- id: kogaku-0024
  subject: kogaku
  topic: 電池単体の端子電圧測定(アナログテスタ)
  variants:
