  choices:
    - "信号波の強度が多少変わっても、受信機出力は変わらない。"
    - "同じ周波数の妨害があっても、信号波の方が強ければ妨害波は抑圧される。"
    - "周波数偏移を大きくしても、占有周波数帯幅は変わらない。"
    - "AM(A3E)方式に比べて、受信機出力の音質が良い。"
  answer: 2
  explanation: |
    正答(誤っているもの)は「周波数偏移を大きくしても、占有周波数帯幅は変わらない」。
    FMの占有周波数帯幅はおよそ 2(周波数偏移＋信号波周波数) で表され、
    周波数偏移を大きくすれば帯幅も広がる。
    他の3つはFMの正しい長所: 振幅制限器で振幅変動を除けるため信号強度が
    多少変わっても出力は一定、同一周波数の妨害は強い方が弱い方を抑圧する
    (FM特有の抑圧効果)、AMより雑音に強く音質が良い。
