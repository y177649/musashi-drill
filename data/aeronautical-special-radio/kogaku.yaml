  choices:
    - "DC VOLTS"
    - "AC VOLTS"
    - "OHMS"
    - "DC MILLI AMPERES"
  answer: 0
  explanation: |
    正答は「DC VOLTS」。電池の端子電圧は直流電圧なので直流電圧レンジで測る。
    電圧測定は測定対象に並列に当てる。
    AC VOLTS は交流電圧用、OHMS は抵抗・導通確認用、
    DC MILLI AMPERES は直流電流用で、電池に直接当てると短絡させてしまう。
