  answer: 1
  explanation: |
    正答は「忠実度」。忠実度は送信された元の信号を受信機出力でどれだけ
    忠実に再現できるかを表す。
    選択度は混信の中から目的の電波を選び出す能力、安定度は再調整なしに
    一定の出力を保てる能力、感度はどれだけ弱い電波まで受信できるかの能力。
    4性能の定義文をそのまま問う形式なので、定義と名称を1対1で結びつけておく。
  figure: null

- id: kogaku-0038
  subject: kogaku
  topic: VHF無線電話用制御器で制御できない機能(アンテナ切換え)
  variants:
    - source: "2024-10"
      text: |
        航空機搭載のVHF無線電話用制御器の機能のうち、制御できないのはどれか。次のうちから選べ。
  choices:
    - "電源のON"
    - "電源のOFF"
    - "アンテナの切換え"
    - "周波数の切換え"
  answer: 2
  explanation: |
    正答(制御できないもの)は「アンテナの切換え」。VHF無線電話用制御器
    (コントロール・パネル)でできるのは電源のON/OFFと周波数(チャネル)の切換え、
    および音量・スケルチの調整であり、アンテナは機体に固定されていて
    操縦席から切り換えるものではない。
  figure: null

- id: kogaku-0039
  subject: kogaku
  topic: コンデンサの静電容量
  variants:
    - source: "2025-02"
      text: |
        コンデンサの静電容量の大きさは、絶縁物の種類によって異なるが、両金属板の向かい合っている面積がAほど、また、間隔がBほど大きくなる。
  choices:
    - "大きい、狭い"
    - "小さい、広い"
    - "大きい、広い"
    - "小さい、狭い"
  answer: 0
  explanation: |
    正答は「A＝大きい、B＝狭い」。静電容量は C＝ε S/d であり、
    向かい合う面積 S に比例し、極板間隔 d に反比例する。
    よって面積が大きいほど、間隔が狭いほど容量は大きくなる。
    選択肢は「大きい/小さい」「広い/狭い」の4通りの組合せなので、
    比例と反比例の向きを取り違えないことだけが要点。
  figure: null

- id: kogaku-0040
  subject: kogaku
  topic: 電波の伝搬距離
  variants:
    - source: "2025-02"
      text: |
        自由空間において、電波が20〔μs〕の間に伝搬する距離はどれか。次のうちから選べ。
  choices:
    - "60〔km〕"
    - "20〔km〕"
    - "6〔km〕"
    - "2〔km〕"
  answer: 2
  explanation: |
    正答は「6〔km〕」。3×10⁸〔m/s〕×20×10⁻⁶〔s〕＝6,000〔m〕＝6〔km〕。
    「1〔μs〕で約300〔m〕」を覚えておけば 300×20＝6,000〔m〕と暗算できる。
    桁を1つ間違えた「60〔km〕」が有力な誤答として並べられているので、
    単位の換算(μs＝10⁻⁶s、m→km)を丁寧に行うこと。
  figure: null

- id: kogaku-0041
  subject: kogaku
  topic: レーダーの方位分解能(定義選択)
  variants:
    - source: "2025-02"
      text: |
        レーダーから等距離にあって、近接した2物標が区別できる限界の能力を表すものはどれか。次のうちから選べ。
  choices:
    - "最小探知距離"
    - "方位分解能"
    - "最大探知距離"
    - "距離分解能"
  answer: 1
  explanation: |
    正答は「方位分解能」。「等距離にあって近接した2物標」は距離が同じで
    方位だけが違う関係なので、これを分離する能力は方位分解能であり、
    アンテナの水平面内指向性(ビーム幅)で決まる。
    同じ方位で距離が近い2物標を分離するのが距離分解能(パルス幅で決まる)。
    選択肢に距離分解能も並んでいるため、問題文の「等距離」を必ず確認すること。
  figure: null

- id: kogaku-0042
  subject: kogaku
  topic: 電池についての記述(誤り選択)
  variants:
    - source: "2025-02"
      text: |
        電池についての記述として、誤っているのはどれか。次のうちから選べ。
  choices:
    - "二次電池は、繰り返し充放電して使える。"
    - "鉛蓄電池及びリチウムイオン蓄電池は、二次電池である。"
    - "電圧が等しく、容量が10〔Ah〕の電池を2個直列に接続すると、合成容量は20〔Ah〕になる。"
    - "電圧の等しい電池を2個並列に接続すると、その端子電圧は1個の端子電圧と同じになる。"
  answer: 2
  explanation: |
    正答(誤っているもの)は「容量が10〔Ah〕の電池を2個直列に接続すると、
    合成容量は20〔Ah〕になる」。直列接続で加算されるのは電圧であって容量ではなく、
    合成容量は10〔Ah〕のまま。20〔Ah〕になるのは並列接続の場合。
    他の3つは正しい: 二次電池は充放電を繰り返して使える、鉛蓄電池と
    リチウムイオン蓄電池はいずれも二次電池、並列接続では端子電圧は1個分と同じ。
  figure: null

- id: kogaku-0043
  subject: kogaku
  topic: 電池単体の端子電圧測定(アナログテスタ)
  variants:
    - source: "2025-02"
      text: |
        アナログ方式の回路計(テスタ)を用いて電池単体の端子電圧を測定するには、どの測定レンジを使用すればよいか。次のうちから選べ。
  choices:
    - "OHMS"
    - "DC VOLTS"
    - "AC VOLTS"
    - "DC MILLI AMPERES"
  answer: 1
  explanation: |
    正答は「DC VOLTS」。電池の端子電圧は直流なので直流電圧レンジを使い、
    測定対象に並列に当てる。
    OHMSは抵抗・導通確認用、AC VOLTSは交流電圧用、DC MILLI AMPERESは
    直流電流用で、電流レンジを電池に直接当てると短絡状態になり危険。
  figure: null

- id: kogaku-0044
  subject: kogaku
  topic: A3E変調の占有周波数帯幅
  variants:
    - source: "2025-02"
      text: |
        周波数fCの搬送波を、周波数fSの信号波で振幅変調(A3E)を行ったときの占有周波数帯幅はどれか。次のうちから選べ。
  choices:
    - "fC－fS"
    - "fC＋fS"
    - "2fC"
    - "2fS"
  answer: 3
  explanation: |
    正答は「2fS」。A3E(振幅変調)では搬送波の上下に fC＋fS と fC－fS の
    側波帯が生じ、占有周波数帯幅はその差の 2fS となる。
    すなわち帯域幅は信号波の周波数だけで決まり、搬送波周波数 fC には
    よらない。fC を含む選択肢はすべて誤り、と判断すれば2択まで絞れる。
  figure: null

- id: kogaku-0045
  subject: kogaku
  topic: 電波高度計の測定原理
  variants:
    - source: "2025-02"
      text: |
        次の記述は、図に示す電波高度計について述べたものである。航空機より真下に向けてAを発射し、地表で反射され再び航空機に戻ってくるまでのBによって高度を測る計器である。
  choices:
    - "2.45、時間"
    - "2.45、振幅の変化"
    - "4.3、時間"
    - "4.3、振幅の変化"
  answer: 2
  explanation: |
    正答は「A＝4.3、B＝時間」。電波高度計は 4.2〜4.4〔GHz〕(約4.3〔GHz〕)の
    電波を真下に発射し、地表で反射して戻るまでの時間から高度を算出する。
    2.45〔GHz〕は電子レンジや無線LANが使うISMバンドで、高度計の周波数ではない。
    振幅の変化ではなく往復時間を測る点も押さえること。
  figure: null

- id: kogaku-0046
  subject: kogaku
  topic: SSRモードSとATCRBSの両立性・アドレス指定
  variants:
    - source: "2025-02"
      text: |
        SSRモードSシステムは、現在使用されているATCRBSとA、ICAOの国際標準方式の新しいシステムである。この方式は、目的とする航空機にのみBを指定して質問ができるため、交通量の多い空域でも目的機を見つけやすく、管制側と航空機間とでメッセージやデータ交換ができ、音声の通信量が少なくてすむ等の特徴がある。
  choices:
    - "互換性があり、時間"
    - "互換性があり、アドレス"
    - "互換性がなく、アドレス"
    - "互換性がなく、時間"
  answer: 1
  explanation: |
    正答は「A＝互換性があり、B＝アドレス」。モードSの S は Select で、
    機体固有のアドレスを指定して目的の航空機だけに質問できるため、
    交通量の多い空域でも目的機を識別しやすい。
    また従来のATCRBS(モードA/C)とも互換性を持つよう設計されており、
    既存機材をそのまま使い続けられる。この2点がモードSの最大の特徴。
  figure: null

- id: kogaku-0047
  subject: kogaku
  topic: ATCトランスポンダの動作(モードC/MTI×高度/速度)
  variants:
    - source: "2025-02"
      text: |
        次の記述は、ATCトランスポンダの動作について述べたものである。SSRからのAの質問信号に対し自動的にBの情報パルスを応答信号として送信することができる。
  choices:
    - "モードC、高度"
    - "モードC、速度"
    - "MTI、高度"
    - "MTI、速度"
  answer: 0
  explanation: |
    正答は「A＝モードC、B＝高度」。モードCの質問に対してトランスポンダは
    気圧高度の情報パルスを自動応答する。
    MTIは移動目標指示装置で質問モードではないため、MTIを含む選択肢は誤り。
    また応答するのは速度ではなく高度。「C＝高度」と結びつけて覚える。
  figure: null

- id: kogaku-0048
  subject: kogaku
  topic: AGCの働き(正しい記述の選択)
  variants:
    - source: "2025-02"
      text: |
        スーパヘテロダイン受信機のAGCの働きについての記述で、正しいのはどれか。次のうちから選べ。
  choices:
    - "選択度を良くし、近接周波数の混信を除去する。"
    - "受信電波が無くなったときに生ずる大きな雑音を消す。"
    - "受信周波数を中間周波数に変換する。"
    - "受信電波の強さが変動しても、受信出力をほぼ一定にする。"
  answer: 3
  explanation: |
    正答は「受信電波の強さが変動しても、受信出力をほぼ一定にする」。
    AGC(自動利得制御)は入力が強いときは増幅度を下げ、弱いときは上げることで
    出力レベルを一定に保つ回路。
    「選択度を良くし混信を除去」は中間周波増幅器のフィルタ、
    「中間周波数に変換」は周波数変換部、「無信号時の雑音を消す」はスケルチの
    働きであり、いずれもAGCではない。
  figure: null

- id: kogaku-0049
  subject: kogaku
  topic: 緩衝増幅器の目的
  variants:
    - source: "2025-02"
      text: |
        送信機の緩衝増幅器は、どのような目的で設けられているか。次のうちから選べ。
  choices:
    - "所要の送信機出力まで増幅するため。"
    - "終段増幅器の入力として十分な励振電圧を得るため。"
    - "後段の影響により発振器の発振周波数が変動するのを防ぐため。"
    - "発振周波数の整数倍の周波数を取り出すため。"
  answer: 2
  explanation: |
    正答は「後段の影響により発振器の発振周波数が変動するのを防ぐため」。
    緩衝(バッファ)増幅器は発振器と後段の間に置かれ、後段の負荷変動が
    発振器に及ぶのを遮断して周波数を安定させる。
    「所要の出力まで増幅」は電力増幅器、「終段への励振電圧を得る」は
    励振増幅器、「整数倍の周波数を取り出す」は周波数逓倍器の役割。
  figure: null

- id: kogaku-0050
  subject: kogaku
  topic: 電力の計算(抵抗比)
  variants:
    - source: "2025-06"
      text: |
        図に示す電気回路において、抵抗Rの値の大きさを2倍にすると、この抵抗で消費される電力は、何倍になるか。次のうちから選べ。
  choices:
    - "1/4倍"
    - "1/2倍"
    - "2倍"
    - "4倍"
  answer: 1
  explanation: |
    正答は「1/2倍」。電源電圧が一定のとき P＝E²/R なので、電力は抵抗に反比例する。
    R を2倍にすれば P は 1/2 倍になる。
    電圧を変える問題(2乗に比例)と抵抗を変える問題(反比例)が混在して
    出題されるので、どちらを変えたのかを必ず確認してから式を選ぶこと。
  figure: null

- id: kogaku-0051
  subject: kogaku
  topic: FET/接合形トランジスタの電極対応
  variants:
    - source: "2025-06"
      text: |
        電界効果トランジスタ(FET)の電極と一般の接合形トランジスタの電極の組合せで、その働きが対応しているのはどれか。次のうちから選べ。
  choices:
    - "ドレイン、ベース"
    - "ドレイン、エミッタ"
    - "ゲート、コレクタ"
    - "ソース、エミッタ"
  answer: 3
  explanation: |
    正答は「ソース、エミッタ」。FETと接合形トランジスタの電極の対応は
    ゲート↔ベース、ドレイン↔コレクタ、ソース↔エミッタ。
    ソースもエミッタも電流(キャリア)の出発点であり、共通端子として使われる点が
    対応している。G-B、D-C、S-E の3組をまとめて覚え、どの組合せを問われても
    答えられるようにしておく。
  figure: null

- id: kogaku-0052
  subject: kogaku
  topic: レーダー最大探知距離
  variants:
    - source: "2025-06"
      text: |
        レーダーの最大探知距離を長くする方法として、誤っているのはどれか。次のうちから選べ。
  choices:
    - "送信電力を大きくする。"
    - "パルス幅を狭くし、パルス繰返し周波数を高くする。"
    - "受信機の感度を良くする。"
    - "アンテナの設置位置を高くし、アンテナ利得を大きくする。"
  answer: 1
  explanation: |
    正答(誤っているもの)は「パルス幅を狭くし、パルス繰返し周波数を高くする」。
    最大探知距離を伸ばすにはパルス幅を広げて送信エネルギーを大きくし、
    遠方からの反射が戻るまで待てるようパルス繰返し周波数は低くする。
    パルス幅を狭くするのは最小探知距離・距離分解能の改善策。
    残る3つ(送信電力↑、アンテナ高・利得↑、受信感度↑)はすべて正しい方法。
  figure: null

- id: kogaku-0053
  subject: kogaku
  topic: 蓄電池の直列接続(6V×3)
  variants:
    - source: "2025-06"
      text: |
        1個6〔V〕、30〔Ah〕の蓄電池を3個直列に接続した場合の合成電圧及び合成容量の組合せで、正しいのはどれか。次のうちから選べ。
  choices:
    - "6〔V〕、90〔Ah〕"
    - "6〔V〕、30〔Ah〕"
    - "18〔V〕、90〔Ah〕"
    - "18〔V〕、30〔Ah〕"
  answer: 3
  explanation: |
    正答は「18〔V〕、30〔Ah〕」。直列接続では電圧が加算され容量は変わらない。
    6〔V〕×3＝18〔V〕、容量は30〔Ah〕のまま。
    同じ「6〔V〕30〔Ah〕を3個」でも並列接続なら6〔V〕・90〔Ah〕となり、
    選択肢にはその値も並べられている。直列か並列かを読み違えないこと。
  figure: null

- id: kogaku-0054
  subject: kogaku
  topic: DSB送信機で音声信号により変化させる搬送波の要素
  variants:
    - source: "2025-06"
      text: |
        DSB(A3E)送信機では、音声信号によって搬送波をどのように変化させるか。次のうちから選べ。
  choices:
    - "搬送波の発射を断続させる。"
    - "周波数を変化させる。"
    - "振幅を変化させる。"
    - "振幅と周波数をともに変化させる。"
  answer: 2
  explanation: |
    正答は「振幅を変化させる」。DSB(A3E)は振幅変調方式であり、音声信号に応じて
    搬送波の振幅を変化させる。
    周波数を変化させるのはFM、発射を断続させるのはA1A(電信)、
    振幅と周波数をともに変化させる方式はここでは該当しない。
  figure: null

- id: kogaku-0055
  subject: kogaku
  topic: DME(距離測定装置)の測定原理
  variants:
    - source: "2025-06"
      text: |
        次の記述は、図に示す航空用DMEについて述べたものである。航空機の機上DME(インタロゲータ)から、地上DMEに質問信号を送信し、質問信号に対する地上DME(トランスポンダ)からの応答信号を受信して、質問信号の送信から応答信号の受信までのAを計測し、航空機と地上DMEとのBを求めることができる。
  choices:
    - "周波数差、高度"
    - "周波数差、距離"
    - "時間、高度"
    - "時間、距離"
  answer: 3
  explanation: |
    正答は「A＝時間、B＝距離」。DME(Distance Measuring Equipment)は
    機上から質問信号を送り、地上局からの応答信号が返るまでの往復時間を測り、
    電波の速度を掛けて距離に換算する装置。名称のとおり求まるのは距離であり
    高度ではない。周波数差から求めるのはドプラ方式(速度)で、DMEの原理ではない。
  figure: null

- id: kogaku-0056
  subject: kogaku
  topic: 受信機の性能(忠実度の識別)
  variants:
    - source: "2025-06"
      text: |
        次の記述は、受信機の性能のうち何について述べたものか。送信された元の信号が、受信機の出力側でどれだけ忠実に再現されるかの能力を表す。
  choices:
    - "選択度"
    - "安定度"
    - "感度"
    - "忠実度"
  answer: 3
  explanation: |
    正答は「忠実度」。忠実度は元の信号が受信機出力でどれだけ忠実に再現されるかを表す。
    選択度は目的波を選び出す能力、安定度は再調整なしで一定出力を保つ能力、
    感度はどれだけ弱い電波まで受信できるかの能力。
    同じ定義文が選択肢の並びを変えて繰り返し出題されるので、
    番号ではなく「忠実度」という語で覚えること。
  figure: null

- id: kogaku-0057
  subject: kogaku
  topic: 電力の計算(電圧を変えた場合)
  variants:
    - source: "2025-10"
      text: |
        3〔A〕の電流を流すと30〔W〕の電力を消費する抵抗器がある。これに50〔V〕の電圧を加えたとき、消費される電力の値として正しいのはどれか。次のうちから選べ。
  choices:
    - "150〔W〕"
    - "250〔W〕"
    - "500〔W〕"
    - "750〔W〕"
  answer: 3
  explanation: |
    正答は「750〔W〕」。まず抵抗値を求める。P＝I²R より 30＝3²×R、R＝30/9＝10/3〔Ω〕。
    次に50〔V〕を加えたときの電力は P＝E²/R＝50²÷(10/3)＝2,500×3/10＝750〔W〕。
    割り切れない抵抗値が出るが、分数のまま E² に掛ければきれいに求まる。
    与えられた電流・電力から抵抗を出す→電圧の式に入れる、の2段階は定番。
  figure: null

- id: kogaku-0058
  subject: kogaku
  topic: ブラウンアンテナの放射素子長さ(計算)
  variants:
    - source: "2025-10"
      text: |
        120〔MHz〕用ブラウンアンテナの放射素子の長さの値として最も近いものはどれか。次のうちから選べ。
  choices:
    - "0.3〔m〕"
    - "0.6〔m〕"
    - "1.2〔m〕"
    - "2.5〔m〕"
  answer: 1
  explanation: |
    正答は「0.6〔m〕」。まず波長を求める。λ＝300/f〔MHz〕＝300/120＝2.5〔m〕。
    ブラウンアンテナ(グランドプレーンアンテナ)の放射素子は1/4波長なので
    2.5÷4＝0.625〔m〕、最も近いのは0.6〔m〕。
    λ＝2.5〔m〕そのままの選択肢や1/2波長の1.2〔m〕が誤答として並ぶので、
    「放射素子はλ/4」を忘れないこと。
  figure: null

- id: kogaku-0059
  subject: kogaku
  topic: レーダー受信機の雑音
  variants:
    - source: "2025-10"
      text: |
        レーダー受信機において、最も影響の大きい雑音はどれか。次のうちから選べ。
  choices:
    - "自動車の電気的雑音"
    - "電動機による雑音"
    - "受信機の内部雑音"
    - "空電による雑音"
  answer: 2
  explanation: |
    正答は「受信機の内部雑音」。レーダーが扱うマイクロ波帯では、自動車や電動機の
    電気的雑音、空電(雷)といった外来雑音はほとんど届かない。
    一方、受信機自身の素子が発生する内部雑音は常に存在し、これが微弱な反射波を
    検出する限界を決めるため最も影響が大きい。低雑音増幅器が重視されるのはこのため。
  figure: null

- id: kogaku-0060
  subject: kogaku
  topic: 直流電源装置の回路説明(誤り選択:変圧器はDCを作る)
  variants:
    - source: "2025-10"
      text: |
        図に示す一般的な直流電源(DC電源)装置の回路についての記述として、誤っているのはどれか。次のうちから選べ。
  choices:
    - "整流回路は、大きさと方向が変化する電圧(電流)を一方向の電圧(電流)に変える。"
    - "平滑回路は、整流された電圧(電流)を完全な直流に近づける。"
    - "平滑回路の働きが不十分だと、出力は完全な直流にならずに、交流分を含む。"
    - "変圧器は、任意の大きさの直流電圧を作る。"
  answer: 3
  explanation: |
    正答(誤っているもの)は「変圧器は、任意の大きさの直流電圧を作る」。
    変圧器は電磁誘導で動作するため交流にしか使えず、作るのは交流電圧である。
    直流に変えるのは次段の整流回路の役割。
    他の3つは正しい: 整流回路は交流を一方向の脈流に変え、平滑回路はその脈流を
    直流に近づけ、平滑が不十分だと出力に交流分(リプル)が残る。
  figure: null

- id: kogaku-0061
  subject: kogaku
  topic: 電流・電圧・直流測定時の接続方法(A/B/C穴埋め)
  variants:
    - source: "2025-10"
      text: |
        回路のAを測定するときは、測定回路に直列に計器を接続し、Bを測定するときは、測定回路に並列に計器を接続する。また、特にCを測定するときは、極性を間違わないよう注意しなければならない。
  choices:
    - "電流、電圧、直流"
    - "電流、電圧、交流"
    - "電圧、電流、直流"
    - "電圧、電流、交流"
  answer: 0
  explanation: |
    正答は「A＝電流、B＝電圧、C＝直流」。電流計は測定したい電流をそのまま
    流し込む必要があるので回路に直列に入れ、電圧計は測りたい2点間に当てるので
    並列に接続する。
    また直流は＋と－の向きがあるため、極性を逆にすると指針が逆に振れて
    測定できない(可動コイル形は破損のおそれもある)。交流には極性がない。
  figure: null

- id: kogaku-0062
  subject: kogaku
  topic: AM/FM変調で変化させる搬送波の要素
  variants:
    - source: "2025-10"
      text: |
        AM変調は、信号波に応じて搬送波のAを変化させる。FM変調は、信号波に応じて搬送波のBを変化させる。
  choices:
    - "周波数、振幅"
    - "周波数、周波数"
    - "振幅、周波数"
    - "振幅、振幅"
  answer: 2
  explanation: |
    正答は「A＝振幅、B＝周波数」。AM＝Amplitude Modulation(振幅変調)、
    FM＝Frequency Modulation(周波数変調)で、英語の頭文字がそのまま答え。
    選択肢はA・Bの並びを入れ替えた4通りしかないので、
    どちらがAM側でどちらがFM側かだけ取り違えなければ確実に正解できる。
  figure: null

- id: kogaku-0063
  subject: kogaku
  topic: 機上気象レーダーのコントロールパネル(誤り選択)
  variants:
    - source: "2025-10"
      text: |
        図に示す機上気象レーダーのコントロールパネルの操作に伴う機能で誤っているのはどれか。次のうちから選べ。
  choices:
    - "STBY：準備が完了した状態であり、電波は発射されている。"
    - "RANGE：測定距離範囲を切り替えるために用いられ、目的に応じて適切なRANGEを選択する。"
    - "ANT TILT：レーダーアンテナの垂直方向の角度を調整するために用いられ、上方に10度下方に15度の範囲で任意にセットできる。"
    - "GAIN：目標物の最適な影像が得られるように受信機の利得を調整する。"
  answer: 0
  explanation: |
    正答(誤っているもの)は「STBY：準備が完了した状態であり、電波は発射されている」。
    STBY(スタンバイ)は準備完了だが電波は発射されない待機状態である。
    他の3つは正しい: RANGE は測定距離範囲の切替、ANT TILT はアンテナの垂直方向
    角度の調整(上方10度・下方15度)、GAIN は受信機の利得の調整。
    GAIN を「送信機の出力を調整する」と書き換えて誤りにする出題もあるので、
    STBY と GAIN の2箇所に注意する。
  figure: null

- id: kogaku-0064
  subject: kogaku
  topic: SSR設備の分類(二次レーダー)
  variants:
    - source: "2025-10"
      text: |
        航空交通管制用として地上に設置されているSSR設備は、次のうち、どれに含まれるか。下の番号から選べ。
  choices:
    - "ドプラレーダー"
    - "CWレーダー"
    - "一次レーダー"
    - "二次レーダー"
  answer: 3
  explanation: |
    正答は「二次レーダー」。SSR(Secondary Surveillance Radar)は文字どおり
    二次レーダーで、地上から質問信号を送り、航空機側のATCトランスポンダが
    応答電波を送り返す方式。反射波を利用するのが一次レーダーで、
    CWレーダー・ドプラレーダーはその一種。
  figure: null

- id: kogaku-0065
  subject: kogaku
  topic: ATCトランスポンダのSPI送信操作(アイデント・ボタン)
  variants:
    - source: "2025-10"
      text: |
        図に示すATCトランスポンダにおいて、管制官からの識別のための要請により、SPI(特別位置識別)パルスを送信するときの操作として、正しいのはどれか。次のうちから選べ。
  choices:
    - "ファンクション・セレクタを「TST」の位置にする。"
    - "アイデント・ボタンを押す。"
    - "ファンクション・セレクタを「ALT」の位置にする。"
    - "ファンクション・セレクタを「STBY」の位置にする。"
  answer: 1
  explanation: |
    正答は「アイデント・ボタンを押す」。SPI(特別位置識別)パルスは管制官の要請に
    応じてアイデント・ボタンを押すことで送出され、レーダー画面上で自機の表示が
    強調される。
    TSTは自己点検、ALTは高度情報の送信、STBYは応答しない待機状態で、
    ファンクション・セレクタの操作ではSPIは送出できない。
  figure: null

- id: kogaku-0066
  subject: kogaku
  topic: 受信障害の原因にならないもの
  variants:
    - source: "2025-10"
      text: |
        無線受信機において、通常、受信に障害を与える雑音の原因にならないのはどれか。次のうちから選べ。
  choices:
    - "発電機のブラシの火花"
    - "電源用電池の容量低下"
    - "高周波加熱装置"
    - "給電線のコネクタのゆるみによるアンテナとの接触不良"
  answer: 1
  explanation: |
    正答(障害の原因にならないもの)は「電源用電池の容量低下」。
    電池の容量が減ると動作時間が短くなったり出力が下がったりするが、
    雑音そのものを発生させるわけではない。
    他の3つは雑音源になる: 発電機のブラシの火花は火花放電による広帯域雑音、
    高周波加熱装置は強力な高周波の漏れ、コネクタのゆるみによる接触不良は
    接触部でのスパークや断続によりガリガリという雑音を生じる。
  figure: null

- id: kogaku-0067
  subject: kogaku
  topic: スケルチ調整の手順
  variants:
    - source: "2025-10"
      text: |
        相手局からの送話がAときに受信機から雑音が出るときは、B調整つまみを回して、雑音が消える限界点付近の位置に調整する。
  choices:
    - "有る、スケルチ"
    - "有る、音量"
    - "無い、スケルチ"
    - "無い、音量"
  answer: 2
  explanation: |
    正答は「A＝無い、B＝スケルチ」。スケルチは相手からの送話が無い(無信号の)ときに
    出る「ザー」という雑音を消すための機能で、雑音がちょうど消える限界点付近に
    調整するのがこつ。深く絞りすぎると弱い信号まで消えて受信できなくなる。
    音量調整つまみでは音を小さくできるだけで、信号が来たときも聞こえなくなるため
    雑音対策にはならない。
  figure: null

- id: kogaku-0068
  subject: kogaku
  topic: 電力の計算(電圧を変えた場合)
  variants:
    - source: "2026-02"
      text: |
        2〔A〕の電流を流すと40〔W〕の電力を消費する抵抗器がある。これに50〔V〕の電圧を加えたとき、消費される電力の値として正しいのはどれか。次のうちから選べ。
  choices:
    - "25〔W〕"
    - "50〔W〕"
    - "250〔W〕"
    - "500〔W〕"
  answer: 2
  explanation: |
    正答は「250〔W〕」。P＝I²R より 40＝2²×R、R＝10〔Ω〕。
    これに50〔V〕を加えると P＝E²/R＝50²/10＝2,500/10＝250〔W〕。
    同種の問題が数値を変えて繰り返し出題されるので、
    「電流と電力から抵抗を出す→E²/R に入れる」という手順で覚えること。
  figure: null

- id: kogaku-0069
  subject: kogaku
  topic: レーダーの方位分解能
  variants:
    - source: "2026-02"
      text: |
        レーダーの方位分解能を決定するものはどれか。次のうちから選べ。
  choices:
    - "アンテナの回転速度"
    - "アンテナの水平面内指向性"
    - "アンテナの垂直面内指向性"
    - "送信電力"
  answer: 1
  explanation: |
    正答は「アンテナの水平面内指向性」。方位分解能は水平方向のビームの細さで
    決まるため、水平面内指向性が支配する。
    垂直面内指向性は上下方向の覆域、回転速度は画面の更新頻度、
    送信電力は最大探知距離に関係するもので、いずれも方位分解能は決めない。
  figure: null

- id: kogaku-0070
  subject: kogaku
  topic: 電池についての記述(誤り選択)
  variants:
    - source: "2026-02"
      text: |
        電池についての記述として、誤っているのはどれか。次のうちから選べ。
  choices:
    - "二次電池は、繰り返し充放電して使える。"
    - "電圧が等しく、容量が10〔Ah〕の電池を2個直列に接続すると、合成容量は20〔Ah〕になる。"
    - "鉛蓄電池及びリチウムイオン蓄電池は、二次電池である。"
    - "電圧の等しい電池を2個並列に接続すると、その端子電圧は1個の端子電圧と同じになる。"
  answer: 1
  explanation: |
    正答(誤っているもの)は「容量が10〔Ah〕の電池を2個直列に接続すると、
    合成容量は20〔Ah〕になる」。直列接続で加算されるのは電圧で、容量は
    10〔Ah〕のまま。20〔Ah〕になるのは並列接続の場合である。
    他の3つは正しい記述。直列・並列と電圧・容量の対応は
    「直列＝電圧が増える／並列＝容量が増える」で整理する。
  figure: null

- id: kogaku-0071
  subject: kogaku
  topic: SSR/MTIとモードA/Cの組合せ(識別用・高度情報用)
  variants:
    - source: "2026-02"
      text: |
        AからATCトランスポンダへの質問信号は、航空機の識別用としてBが、航空機の高度情報用としてCが用いられている。
  choices:
    - "SSR、モードC、モードA"
    - "SSR、モードA、モードC"
    - "MTI、モードC、モードA"
    - "MTI、モードA、モードC"
  answer: 1
  explanation: |
    正答は「A＝SSR、B＝モードA、C＝モードC」。ATCトランスポンダに質問信号を
    送るのは地上のSSR(二次監視レーダー)であり、MTI(移動目標指示装置)ではない。
    質問モードはA＝識別、C＝高度と対応する。
    選択肢は「SSR/MTI」と「モードA/モードC」の並びを入れ替えた4通りなので、
    この2点を押さえれば確実に選べる。
  figure: null

- id: kogaku-0072
  subject: kogaku
  topic: ATCトランスポンダのSPI送信操作(アイデント・ボタン)
  variants:
    - source: "2026-02"
      text: |
        図に示すATCトランスポンダにおいて、管制官からの識別のための要請により、SPI(特別位置識別)パルスを送信するときの操作として、正しいのはどれか。次のうちから選べ。
  choices:
    - "ファンクション・セレクタを「TST」の位置にする。"
    - "ファンクション・セレクタを「ALT」の位置にする。"
    - "ファンクション・セレクタを「STBY」の位置にする。"
    - "アイデント・ボタンを押す。"
  answer: 3
  explanation: |
    正答は「アイデント・ボタンを押す」。管制官からの「Squawk ident」の要請に対し、
    アイデント・ボタンを押してSPI(特別位置識別)パルスを送出する。
    ファンクション・セレクタのTST(自己点検)・ALT(高度情報の送信)・STBY(待機)は
    いずれもSPIの送出とは無関係。
    同じ問題が選択肢の並びを変えて繰り返し出題されている。
  figure: null

- id: kogaku-0073
  subject: kogaku
  topic: AGCの働き(正しい記述の選択)
  variants:
    - source: "2026-02"
      text: |
        スーパヘテロダイン受信機のAGCの働きについての記述で、正しいのはどれか。次のうちから選べ。
  choices:
    - "受信周波数を中間周波数に変換する。"
    - "受信電波の強さが変動しても、受信出力をほぼ一定にする。"
    - "選択度を良くし、近接周波数の混信を除去する。"
    - "受信電波が無くなったときに生ずる大きな雑音を消す。"
  answer: 1
  explanation: |
    正答は「受信電波の強さが変動しても、受信出力をほぼ一定にする」。
    AGC(自動利得制御)は入力が強ければ増幅度を下げ、弱ければ上げることで
    出力レベルを一定に保つ。フェージングがあっても音量が変動しないのはこの働き。
    「中間周波数に変換」は周波数変換部、「混信を除去」は中間周波増幅器のフィルタ、
    「無信号時の雑音を消す」はスケルチの働き。
  figure: null

- id: kogaku-0074
  subject: kogaku
  topic: VHF送受信装置の良好な受信のための機能(スケルチ)
  variants:
    - source: "2026-02"
      text: |
        航空用VHF送受信装置の機能で、受信待受時に雑音が聞こえないように調整し、良好な受信を行うものはどれか。次のうちから選べ。
  choices:
    - "音量調整"
    - "電源スイッチ"
    - "チャネル切換"
    - "スケルチ"
  answer: 3
  explanation: |
    正答は「スケルチ」。スケルチは受信入力が一定レベル以下のときに低周波増幅を
    止め、待受中の耳障りな雑音をスピーカに出さないようにする機能。
    音量調整は音の大きさ、チャネル切換は周波数の選択、電源スイッチは入切であり、
    いずれも雑音を抑える機能ではない。
  figure: null

- id: kogaku-0075
  subject: kogaku
  topic: オームの法則(電圧の計算)
  variants:
    - source: "2026-06"
      text: |
        抵抗負荷で消費される電力が15〔W〕のとき、この負荷に流れる電流は5〔A〕であった。このときの負荷の両端の電圧の値として正しいのはどれか。次のうちから選べ。
  choices:
    - "20.0〔V〕"
    - "15.0〔V〕"
    - "10.0〔V〕"
    - "3.0〔V〕"
  answer: 3
  explanation: |
    正答は「3.0〔V〕」。P＝EI より E＝P/I＝15÷5＝3〔V〕。
    電力・電圧・電流の関係式 P＝EI をそのまま使うだけの基本問題。
    15〔V〕(電力の値をそのまま置いた誤答)や20〔V〕など紛らわしい数値が
    並んでいるので、割り算の向きを間違えないこと。
  figure: null

- id: kogaku-0076
  subject: kogaku
  topic: 半導体の温度特性
  variants:
    - source: "2026-06"
      text: |
        半導体は、周囲の温度の上昇によって、一般的に内部の抵抗がAし、流れる電流はBする。
  choices:
    - "減少、減少"
    - "減少、増加"
    - "増加、減少"
    - "増加、増加"
  answer: 1
  explanation: |
    正答は「A＝減少、B＝増加」。半導体は金属と逆の負の温度係数を持ち、
    温度が上がるとキャリアが増えて内部の抵抗が減少する。
    抵抗が減れば オームの法則 I＝E/R により同じ電圧でも電流は増加する。
    「半導体は金属と逆」「抵抗↓→電流↑」の2段階で判断する。
  figure: null

- id: kogaku-0077
  subject: kogaku
  topic: スポラジックE層
  variants:
    - source: "2026-06"
      text: |
        スポラジックE層(Es層)は、Aの昼間に多く発生し、Bの電波を反射することがある。
  choices:
    - "夏季、マイクロ波(SHF)帯"
    - "冬季、マイクロ波(SHF)帯"
    - "夏季、超短波(VHF)帯"
    - "冬季、超短波(VHF)帯"
  answer: 2
  explanation: |
    正答は「A＝夏季、B＝超短波(VHF)帯」。スポラジックE層(Es層)は
    主に夏季の昼間、電離層のE層付近に突発的に発生する電子密度の高い層で、
    通常なら電離層を突き抜けてしまう超短波(VHF)帯の電波を反射し、
    遠距離まで異常伝搬させることがある。
    マイクロ波(SHF)帯はさらに周波数が高くEs層でも反射されない。
  figure: null

- id: kogaku-0078
  subject: kogaku
  topic: レーダー最大探知距離
  variants:
    - source: "2026-06"
      text: |
        レーダーの最大探知距離を長くする方法として、誤っているのはどれか。次のうちから選べ。
  choices:
    - "受信機の感度を良くする。"
    - "パルス幅を狭くし、パルス繰返し周波数を高くする。"
    - "アンテナの設置位置を高くし、アンテナ利得を大きくする。"
    - "送信電力を大きくする。"
  answer: 1
  explanation: |
    正答(誤っているもの)は「パルス幅を狭くし、パルス繰返し周波数を高くする」。
    最大探知距離を伸ばすにはパルス幅を広くして送信エネルギーを増やし、
    遠方からの反射を待てるようパルス繰返し周波数は低くする。
    パルス幅を狭くするのは最小探知距離・距離分解能を良くするための方法。
    残る3つ(受信感度↑、アンテナ高・利得↑、送信電力↑)はすべて正しい。
    選択肢の並び順を変えて何度も出題されている定番問題。
  figure: null

- id: kogaku-0079
  subject: kogaku
  topic: SSR/MTIとモードA/Cの組合せ(質問信号送信元Aを含む拡張版)
  variants:
    - source: "2026-06"
      text: |
        AからATCトランスポンダへの質問信号は、航空機の識別用としてBが、航空機の高度情報用としてCが用いられている。
  choices:
    - "MTI、モードA、モードC"
    - "MTI、モードC、モードA"
    - "SSR、モードA、モードC"
    - "SSR、モードC、モードA"
  answer: 2
  explanation: |
    正答は「A＝SSR、B＝モードA、C＝モードC」。質問信号を出すのは地上の
    SSR(二次監視レーダー)で、MTIは移動目標指示装置なので質問信号は送らない。
    質問モードはA＝識別(便名に対応するコード)、C＝高度。
    A・B・Cの3箇所を問う形式だが、実質は「SSRかMTIか」「モードAとCの順序」の
    2点で決まる。
  figure: null

- id: kogaku-0080
  subject: kogaku
  topic: ATCトランスポンダのファンクション・セレクタ位置(ALT)
  variants:
    - source: "2026-06"
      text: |
        図に示すATCトランスポンダにおいて、高度情報を送信できる状態に設定するときのファンクション・セレクタの切替つまみの位置はどれか。次のうちから選べ。
  choices:
    - "「ALT」の位置"
    - "「STBY」の位置"
    - "「ON」の位置"
    - "「TEST」の位置"
  answer: 0
  explanation: |
    正答は「「ALT」の位置」。ALTはALTitude(高度)の略で、この位置にすると
    モードCの質問に対し高度情報を送信する状態になる。
    ONは応答するが高度情報は送らない位置、STBYは電源は入っているが応答しない
    待機位置、TEST(TST)は自己点検用。
  figure: null

- id: kogaku-0081
  subject: kogaku
  topic: VHF無線電話用制御器で制御できない機能(アンテナ切換え)
  variants:
    - source: "2026-06"
      text: |
        航空機搭載のVHF無線電話用制御器の機能のうち、制御できないのはどれか。次のうちから選べ。
  choices:
    - "周波数の切替え"
    - "アンテナの切替え"
    - "電源のON"
    - "電源のOFF"
  answer: 1
  explanation: |
    正答(制御できないもの)は「アンテナの切替え」。VHF無線電話用制御器で
    操作できるのは電源のON/OFFと周波数(チャネル)の切替え、音量・スケルチの調整で、
    アンテナは機体に固定されており操縦席から切り替えるものではない。
    残る3つはいずれも制御器で操作できる機能。
  figure: null
