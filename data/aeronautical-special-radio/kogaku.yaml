    - "GAIN：目標物の最適な影像が得られるように送信機の出力を調整する。"
    - "STBY：準備が完了した状態であり、電波は発射されない。"
    - "ANT TILT：レーダーアンテナの垂直方向の角度を調整するために用いられ、上方に10度下方に15度の範囲で任意にセットできる。"
  answer: 1
  explanation: |
    正答(誤っているもの)は「GAIN：目標物の最適な影像が得られるように送信機の
    出力を調整する」。GAIN が調整するのは受信機側の利得(感度)であって、
    送信機の出力ではない。
    他の3つは正しい説明: RANGE は測定距離範囲の切替、STBY は電波を出さない
    準備完了状態、ANT TILT はアンテナの垂直方向角度の調整。
  figure: null

