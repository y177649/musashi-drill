- id: kogaku-0025
  subject: kogaku
  topic: A3E変調の占有周波数帯幅
  variants:
    - source: "2024-06"
      text: |
        周波数fCの搬送波を、周波数fSの信号波で振幅変調(A3E)を行ったときの占有周波数帯幅はどれか。次のうちから選べ。
  choices:
    - "2fC"
    - "2fS"
    - "fC－fS"
    - "fC＋fS"
  answer: 1
  explanation: |
    正答は「2fS」。振幅変調(A3E)では搬送波 fC の上下に
    fC＋fS と fC－fS の側波帯ができるので、占有周波数帯幅はその差
    (fC＋fS)－(fC－fS)＝2fS、つまり信号波の周波数の2倍になる。
    搬送波の周波数 fC は帯域幅には関係しない点が引っかけ。
  figure: null

- id: kogaku-0026
  subject: kogaku
  topic: 機上気象レーダーの調整器パネル(誤り選択)
  variants:
    - source: "2024-06"
      text: |
